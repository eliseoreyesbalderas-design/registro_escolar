function drawCalTable(wrap, idx){
  const cfg = state.config;
  const momento = cfg.momentos[idx];
  const criterios = criteriosDe(idx);
  const fullList = state.alumnos.filter(a=>studentAppliesToMomento(a,momento)).sort((a,b)=>Number(a.no)-Number(b.no));
  if(!fullList.length){ wrap.innerHTML = `<div class="empty"><svg><use href="#ic-grades"/></svg><div>Aún no hay alumnos para este momento. Agrégalos en la sección Alumnos.</div></div>`; return; }
  const activeList = fullList.filter(a=>a.status!=='baja');
  const columns = criterios.map(c=>c.nombre).concat(['recuperacion']);
  wrap.innerHTML = `<div class="table-wrap"><table class="sticky-cols">
    <thead><tr><th>No.</th><th>Alumno</th>${criteriaHeaderCells(idx)}<th>Recup.</th><th>Promedio</th><th>Nivel</th><th>Notas</th></tr></thead>
    <tbody>${fullList.map(a=>{
      const nObs = observacionesFor(a.id).length;
      if(a.status==='baja'){
        return `<tr style="opacity:.55"><td>${a.no}</td><td>${a.nombre} <span class="chip chip-bad" style="margin-left:6px;">Baja</span></td>${criterios.map(()=>`<td>—</td>`).join('')}<td>—</td><td>—</td><td>—</td><td>—</td></tr>`;
      }
      const rowIdx = activeList.indexOf(a);
      const g = (state.calificaciones[a.id]||{})[idx] || {};
      const finalv = calcMomentoFinal(a.id, idx);
      const niv = nivelDe(finalv);
      return `<tr>
        <td>${a.no}</td><td>${a.nombre}</td>
        ${criterios.map((c,colIdx)=>`<td><input class="grade-input" type="number" min="0" max="10" step="0.1" style="width:64px;" data-al="${a.id}" data-idx="${idx}" data-c="${c.nombre}" data-row="${rowIdx}" data-col="${colIdx}" value="${g[c.nombre]!==undefined?g[c.nombre]:''}"></td>`).join('')}
        <td><input class="grade-input" type="number" min="0" max="10" step="0.1" style="width:60px;" data-al="${a.id}" data-idx="${idx}" data-c="recuperacion" data-row="${rowIdx}" data-col="${columns.length-1}" value="${g.recuperacion!==undefined?g.recuperacion:''}"></td>
        <td data-final="${a.id}" style="font-weight:800; color:${finalv!==null&&finalv<6?'var(--brick)':'var(--primary)'}">${finalv!==null?finalv:'—'}</td>
        <td data-nivel="${a.id}">${niv?`<span class="chip" style="background:${niv.color}22; color:${niv.color}">${niv.nombre}</span>`:'—'}</td>
        <td><button class="btn btn-sm btn-ghost" data-quickobs="${a.id}" title="Agregar observación">
          <svg style="width:14px;height:14px"><use href="#ic-note"/></svg>${nObs>0?` ${nObs}`:''}
        </button></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;

  function applyGrade(alId, i, crit, rawVal){
    if(!state.calificaciones[alId]) state.calificaciones[alId]={};
    if(!state.calificaciones[alId][i]) state.calificaciones[alId][i]={};
    let v = String(rawVal).trim().replace(',', '.');
    if(v!==''){
      const n = Number(v);
      if(isNaN(n)) return false;
      v = Math.max(0, Math.min(10, n));
    }
    state.calificaciones[alId][i][crit] = v;
    return true;
  }

  function updateComputedRow(alId){
    const finalv = calcMomentoFinal(alId, idx);
    const niv = nivelDe(finalv);
    const finalCell = wrap.querySelector(`[data-final="${alId}"]`);
    const nivelCell = wrap.querySelector(`[data-nivel="${alId}"]`);
    if(finalCell){
      finalCell.textContent = finalv!==null ? finalv : '—';
      finalCell.style.color = (finalv!==null && finalv<6) ? 'var(--brick)' : 'var(--primary)';
    }
    if(nivelCell){
      nivelCell.innerHTML = niv ? `<span class="chip" style="background:${niv.color}22; color:${niv.color}">${niv.nombre}</span>` : '—';
    }
  }

  wrap.querySelectorAll('input[data-al]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const alId = inp.dataset.al, i = Number(inp.dataset.idx), crit = inp.dataset.c;
      applyGrade(alId, i, crit, inp.value);
      markDirty();
      updateComputedRow(alId); // actualización dirigida: no se pierde el foco mientras el profesor escribe
    });
    // Enter o flechas ↑/↓ saltan a la misma columna en el alumno anterior/siguiente, como en una hoja de cálculo.
    inp.addEventListener('keydown', (e)=>{
      if(e.key!=='Enter' && e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
      e.preventDefault();
      const row = Number(inp.dataset.row), col = Number(inp.dataset.col);
      const targetRow = e.key==='ArrowUp' ? row-1 : row+1;
      const next = wrap.querySelector(`input[data-row="${targetRow}"][data-col="${col}"]`);
      if(next){ next.focus(); next.select(); }
    });
    // Pegar un bloque copiado de Excel: llena hacia la derecha y hacia abajo a partir de esta celda.
    inp.addEventListener('paste', (e)=>{
      const text = (e.clipboardData || window.clipboardData).getData('text');
      if(!text || !text.includes('\t') && !text.includes('\n')){ return; } // deja el pegado normal para un solo valor
      e.preventDefault();
      const startRow = Number(inp.dataset.row), startCol = Number(inp.dataset.col);
      const rows = text.replace(/\r/g,'').split('\n').filter((l,i2,arr)=> !(i2===arr.length-1 && l===''));
      let applied = 0;
      rows.forEach((line, r)=>{
        const cells = line.split('\t');
        cells.forEach((val, c)=>{
          const targetRow = startRow + r, targetCol = startCol + c;
          const alumno = activeList[targetRow];
          const colName = columns[targetCol];
          if(!alumno || !colName || val==='') return;
          if(applyGrade(alumno.id, idx, colName, val)) applied++;
        });
      });
      markDirty();
      drawCalTable(wrap, idx);
      toast(applied ? `Se pegaron ${applied} calificación(es)` : 'No se detectaron valores numéricos para pegar');
    });
  });
  wrap.querySelectorAll('[data-quickobs]').forEach(b=>{
    b.addEventListener('click', ()=> openQuickObs(b.dataset.quickobs, idx));
  });
}

/* ---- Estadísticas ---- */
/* ---------------- estadísticas adicionales: mediana, moda, desviación estándar ---------------- */
function calcMediana(arr){
  if(!arr.length) return null;
  const s = arr.slice().sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return Math.round((s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2)*10)/10;
}
function calcModa(arr){
  if(!arr.length) return null;
  const freq = {};
  arr.forEach(v=>{ freq[v]=(freq[v]||0)+1; });
  const claves = Object.keys(freq);
  let max = Math.max(...claves.map(k=>freq[k]));
  if(max<=1) return 'Sin moda (valores únicos)';
  const modas = claves.filter(k=>freq[k]===max).map(Number).sort((a,b)=>a-b);
  return modas.join(', ');
}
function calcDesviacion(arr){
  if(arr.length<2) return null;
  const m = arr.reduce((a,b)=>a+b,0)/arr.length;
  const varianza = arr.reduce((a,b)=>a+Math.pow(b-m,2),0)/arr.length;
  return Math.round(Math.sqrt(varianza)*100)/100;
}
function interpretarDesviacion(d){
  if(d===null) return '';
  if(d<0.8) return 'El grupo es muy homogéneo: la mayoría obtiene calificaciones similares.';
  if(d<1.6) return 'Dispersión moderada: hay algo de variedad en el desempeño del grupo.';
  return 'Dispersión alta: conviene revisar por qué el desempeño varía tanto entre alumnos.';
}

function renderEstadisticas(el){
  const activos = activeStudents();
  const cfg = state.config;
  const gruposProm = cfg.momentos.map((m,i)=>{
    const vals = activos.filter(a=>studentAppliesToMomento(a,m)).map(a=>calcMomentoFinal(a.id,i)).filter(v=>v!==null);
    return vals.length ? Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10 : null;
  });
  const niveles = cfg.niveles.slice().sort((a,b)=>a.min-b.min);
  const lastIdx = [2,1,0].find(i=>gruposProm[i]!==null); const lastIdxSafe = lastIdx===undefined?0:lastIdx;
  const distCounts = niveles.map(()=>0);
  activos.forEach(a=>{
    const f = calcMomentoFinal(a.id,lastIdxSafe);
    if(f===null) return;
    const niv = nivelDe(f);
    const ni = niveles.findIndex(n=>n.nombre===niv.nombre);
    if(ni>=0) distCounts[ni]++;
  });
  const finalesUltimoMomento = activos.map(a=>calcMomentoFinal(a.id,lastIdxSafe)).filter(v=>v!==null);
  const mediana = calcMediana(finalesUltimoMomento);
  const moda = calcModa(finalesUltimoMomento);
  const desviacion = calcDesviacion(finalesUltimoMomento);

  el.innerHTML = `
  <div class="grid grid-2" style="align-items:stretch;">
    <div class="card">
      <h3 style="font-size:15.5px;margin-bottom:14px;">Promedio grupal por momento</h3>
      ${barChart(cfg.momentos.map(m=>m.nombre), gruposProm, 10)}
    </div>
    <div class="card">
      <h3 style="font-size:15.5px;margin-bottom:2px;">Distribución por nivel de desempeño</h3>
      <p style="font-size:12px;color:var(--ink-faint);margin-bottom:12px;">Según el último momento con datos (${cfg.momentos[lastIdxSafe].nombre})</p>
      ${barChart(niveles.map(n=>n.nombre), distCounts, Math.max(...distCounts,1), niveles.map(n=>n.color))}
    </div>
  </div>

          if(a1===null||a2===null) return '<span class="chip chip-muted">—</span>';

          if(d>0.4) return `<span class="chip chip-good">Mejoró +${d}</span>`;
          if(d<-0.4) return `<span class="chip chip-bad">Bajó ${d}</span>`;
          return `<span class="chip chip-muted">Se mantiene</span>`;

        return `<tr><td>${a.no}</td><td>${a.nombre}</td><td>${f[0]??'—'}</td><td>${f[1]??'—'}</td><td>${f[2]??'—'}</td>

          <td style="font-weight:800;color:${prom!==null&&prom<6?'var(--brick)':'var(--primary)'}">${prom??'—'}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

function barChart(labels, values, max, colors){
  const w=480, h=180, pad=30, bw = (w-pad*2)/labels.length;
  const bars = labels.map((lab,i)=>{
    const v = values[i]; const vv = v===null?0:v;
    const barH = max>0 ? (vv/max)*(h-50) : 0;
    const x = pad + i*bw + bw*0.18;
    const bwid = bw*0.64;
    const y = h-30-barH;
    const color = colors ? colors[i] : 'var(--primary)';
    return `<rect x="${x}" y="${y}" width="${bwid}" height="${barH}" rx="5" fill="${color}"></rect>
      <text x="${x+bwid/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${v===null?'—':v}</text>
      <text x="${x+bwid/2}" y="${h-12}" text-anchor="middle" font-size="10.5" fill="var(--ink-faint)">${lab}</text>`;
  }).join('');
  return `<svg class="barchart" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-30}" x2="${w-pad}" y2="${h-30}" stroke="var(--line)" stroke-width="1.5"/>
    ${bars}
  </svg>`;
}

    <button class="btn btn-primary" id="printBtn"><svg><use href="#ic-print"/></svg>${reportTipo==='canalizacion' ? 'Registrar y generar documento' : 'Imprimir / Guardar como PDF'}</button>
    <button class="btn" id="marcarEntregaBtn" style="display:none;"><svg><use href="#ic-plus"/></svg>Marcar como entregado hoy</button>
  </div>
  <div class="card" id="reportPreview"></div>
  `;
  document.getElementById('repTipoPills').querySelectorAll('[data-t]').forEach(b=>{
    b.addEventListener('click', ()=>{ reportTipo=b.dataset.t; renderReportes(el); });
  });
  const sub = document.getElementById('repSubOptions');
  if(reportTipo==='parcial'){
    sub.innerHTML = `<div class="pill-tabs" style="margin-bottom:0;">${state.config.momentos.map((m,i)=>`<button class="pill-tab ${reportMomento===i?'active':''}" data-m="${i}">${m.nombre}</button>`).join('')}</div>`;
    sub.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click', ()=>{ reportMomento=Number(b.dataset.m); renderReportes(el); }));
  } else if(reportTipo==='padres'){
    const list = state.alumnos.slice().sort((a,b)=>Number(a.no)-Number(b.no));
    if(!reportAlumno && list.length) reportAlumno = list[0].id;
    sub.innerHTML = `<div class="field" style="max-width:340px; margin-bottom:0;"><select id="repAlumnoSel">${list.map(a=>`<option value="${a.id}" ${a.id===reportAlumno?'selected':''}>${a.no}. ${a.nombre}</option>`).join('')}</select></div>`;
    const s = document.getElementById('repAlumnoSel');
    if(s) s.addEventListener('change', ()=>{ reportAlumno=s.value; renderReportes(el); });
  } else if(reportTipo==='individual'){
    const list = state.alumnos.slice().sort((a,b)=>Number(a.no)-Number(b.no));
    if(!reportAlumno && list.length) reportAlumno = list[0].id;
    const scopeLabel = {general:'General (todo el ciclo)', momento:'Solo un momento', fecha:'Rango de fechas'};
    sub.innerHTML = `
      <div class="field" style="max-width:340px;"><select id="repAlumnoSel">${list.map(a=>`<option value="${a.id}" ${a.id===reportAlumno?'selected':''}>${a.no}. ${a.nombre}</option>`).join('')}</select></div>
      <h4 style="font-size:12.5px; margin:10px 0 6px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);">¿Qué tanto quieres entregar?</h4>
      <div class="pill-tabs" id="fichaScopePills" style="margin-bottom:8px;">
        ${['general','momento','fecha'].map(sc=>`<button class="pill-tab ${fichaScope===sc?'active':''}" data-scope="${sc}">${scopeLabel[sc]}</button>`).join('')}
      </div>
      ${fichaScope==='momento' ? `<div class="pill-tabs" style="margin-bottom:0;">${state.config.momentos.map((m,i)=>`<button class="pill-tab ${fichaMomentoSel===i?'active':''}" data-fmom="${i}">${m.nombre}</button>`).join('')}</div>` : ''}
      ${fichaScope==='fecha' ? `<div class="grid grid-2"><div class="field" style="margin-bottom:0;"><label>Desde</label><input type="date" id="ficha-desde" value="${fichaDesde}"></div><div class="field" style="margin-bottom:0;"><label>Hasta</label><input type="date" id="ficha-hasta" value="${fichaHasta}"></div></div>` : ''}
    `;
    const s = document.getElementById('repAlumnoSel');
    if(s) s.addEventListener('change', ()=>{ reportAlumno=s.value; fichaScope='general'; fichaMomentoSel=0; fichaDesde=''; fichaHasta=''; renderReportes(el); });
    sub.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click', ()=>{ fichaScope=b.dataset.scope; renderReportes(el); }));
    sub.querySelectorAll('[data-fmom]').forEach(b=>b.addEventListener('click', ()=>{ fichaMomentoSel=Number(b.dataset.fmom); renderReportes(el); }));
    const fd = document.getElementById('ficha-desde'), fh = document.getElementById('ficha-hasta');
    if(fd) fd.addEventListener('change', e=>{ fichaDesde=e.target.value; renderReportes(el); });
    if(fh) fh.addEventListener('change', e=>{ fichaHasta=e.target.value; renderReportes(el); });
  } else if(reportTipo==='traspaso'){
    sub.innerHTML = `<div class="helpbox" style="margin-bottom:0;"><svg><use href="#ic-info"/></svg><div>Se incluyen automáticamente los alumnos activos con Índice de Riesgo Escolar por debajo de 50 (riesgo alto o crítico) — combina bajo rendimiento, faltas críticas, tendencia y observaciones.</div></div>`;
  } else if(reportTipo==='canalizacion'){
    const candidatos = state.alumnos.filter(a=>a.status==='activo' && esCandidatoCanalizacion(a.id));
    const list = state.alumnos.slice().sort((a,b)=>Number(a.no)-Number(b.no));
    if(!reportAlumno && list.length) reportAlumno = (candidatos[0]||list[0]).id;
    sub.innerHTML = `
      <div class="helpbox" style="margin-bottom:10px;"><svg><use href="#ic-info"/></svg><div>${candidatos.length? `${candidatos.length} alumno(s) acumulan ${state.config.umbralCanalizacion}+ observaciones conductuales o de atención a padres (marcados con 🚩).` : 'Ningún alumno ha acumulado suficientes observaciones todavía, pero puedes generar el documento para cualquiera si lo necesitas.'}</div></div>
      <div class="field" style="max-width:340px; margin-bottom:0;"><select id="repAlumnoSel">${list.map(a=>`<option value="${a.id}" ${a.id===reportAlumno?'selected':''}>${a.no}. ${a.nombre}${esCandidatoCanalizacion(a.id)?' 🚩':''}</option>`).join('')}</select></div>
    `;
    const s = document.getElementById('repAlumnoSel');
    if(s) s.addEventListener('change', ()=>{ reportAlumno=s.value; canalizacionSolicita=[]; canalizacionNotas=''; canalizacionFiltro='todas'; canalizacionDesde=''; canalizacionHasta=''; renderReportes(el); });
  } else {
    sub.innerHTML='';
  }

  const preview = document.getElementById('reportPreview');
  let html;
  if(reportTipo==='general') html = buildGeneralReportHTML();
  else if(reportTipo==='parcial') html = buildParcialReportHTML(reportMomento);
  else if(reportTipo==='padres') html = state.alumnos.length ? buildBoletinPadresHTML(reportAlumno) : '<p class="hint">Agrega alumnos primero para generar su boletín.</p>';
  else if(reportTipo==='traspaso') html = buildTraspasoHTML();
  else if(reportTipo==='canalizacion'){
    if(!state.alumnos.length) html = '<p class="hint">Agrega alumnos primero.</p>';
    else {
      const todasObs = observacionesRelevantesCanalizacion(reportAlumno);
      const obsIncluidas = observacionesFiltradasCanalizacion(reportAlumno).slice().reverse();
      const filtroLabel = {todas:'Todas', '7':'Últimos 7 días', '30':'Últimos 30 días', rango:'Rango personalizado'};
      html = `
        <div class="no-print" style="margin-bottom:16px; border-bottom:1px solid var(--line); padding-bottom:14px;">
          <h4 style="font-size:13px; margin-bottom:8px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);">¿Qué incidentes incluir?</h4>
          <div class="pill-tabs" id="canalFiltroPills" style="margin-bottom:8px;">
            ${['todas','7','30','rango'].map(f=>`<button class="pill-tab ${canalizacionFiltro===f?'active':''}" data-filtro="${f}">${filtroLabel[f]}</button>`).join('')}
          </div>
          ${canalizacionFiltro==='rango' ? `<div class="grid grid-2" style="margin-bottom:8px;">
            <div class="field" style="margin-bottom:0;"><label>Desde</label><input type="date" id="canal-desde" value="${canalizacionDesde}"></div>
            <div class="field" style="margin-bottom:0;"><label>Hasta</label><input type="date" id="canal-hasta" value="${canalizacionHasta}"></div>
          </div>` : ''}
          <p style="font-size:12px; color:var(--ink-faint); margin-bottom:14px;">Mostrando ${obsIncluidas.length} de ${todasObs.length} observación(es) registradas. Elige "Todas" si necesitas entregar el historial completo.</p>
          <h4 style="font-size:13px; margin-bottom:8px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);">¿Qué solicita el profesor(a)?</h4>
          ${SOLICITUD_OPCIONES.map(op=>`<label style="display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; font-size:13.5px;">
            <input type="checkbox" class="canal-check" value="${op.id}" ${canalizacionSolicita.includes(op.id)?'checked':''} style="width:auto; margin-top:3px;"> <span>${op.label}</span>
          </label>`).join('')}
          <div class="field" style="margin-top:6px; margin-bottom:0;"><label>Contexto adicional (opcional)</label><textarea id="canal-notas" rows="2" placeholder="Cualquier información breve que ayude al área a atender el caso...">${esc(canalizacionNotas)}</textarea></div>
        </div>
        ${obsIncluidas.length? buildCanalizacionHTML(reportAlumno, '(se asigna al registrar)', todayISO(), obsIncluidas, canalizacionSolicita, canalizacionNotas) : '<p class="hint">No hay observaciones que coincidan con este filtro de fecha.</p>'}
      `;
    }
  }
  else html = state.alumnos.length ? buildFichaBodyHTML(reportAlumno, {scope:fichaScope, momentoIdx:fichaMomentoSel, desde:fichaDesde, hasta:fichaHasta}) : '<p class="hint">Agrega alumnos primero para generar su ficha.</p>';
  preview.innerHTML = html;

  if(reportTipo==='canalizacion' && state.alumnos.length){
    preview.querySelectorAll('[data-filtro]').forEach(b=>{
      b.addEventListener('click', ()=>{ canalizacionFiltro = b.dataset.filtro; renderReportes(el); });
    });
    const desdeInp = document.getElementById('canal-desde');
    const hastaInp = document.getElementById('canal-hasta');
    if(desdeInp) desdeInp.addEventListener('change', e=>{ canalizacionDesde = e.target.value; renderReportes(el); });
    if(hastaInp) hastaInp.addEventListener('change', e=>{ canalizacionHasta = e.target.value; renderReportes(el); });
    preview.querySelectorAll('.canal-check').forEach(chk=>{
      chk.addEventListener('change', ()=>{
        if(chk.checked) canalizacionSolicita.push(chk.value); else canalizacionSolicita = canalizacionSolicita.filter(v=>v!==chk.value);
        renderReportes(el);
      });
    });
    const notasTa = document.getElementById('canal-notas');
    if(notasTa) notasTa.addEventListener('input', e=>{ canalizacionNotas = e.target.value; });
  }

  const marcarBtn = document.getElementById('marcarEntregaBtn');
  if(reportTipo==='padres' && state.alumnos.length){
    marcarBtn.style.display = '';
    marcarBtn.onclick = ()=>{
      logEntrega(reportAlumno);
      toast('Entrega registrada con la fecha de hoy');
      renderReportes(el);
    };
  }

  document.getElementById('printBtn').addEventListener('click', ()=>{
    if(reportTipo==='canalizacion'){
      if(!state.alumnos.length) return;
      if(!canalizacionSolicita.length){ toast('Selecciona al menos una solicitud antes de generar el documento'); return; }
      const obsIncluidas = observacionesFiltradasCanalizacion(reportAlumno).slice().reverse();
      if(!obsIncluidas.length){ toast('No hay observaciones en el rango de fecha elegido'); return; }
      const fecha = todayISO();
      const folio = registrarCanalizacion(reportAlumno, { fecha, observaciones:obsIncluidas, solicita:canalizacionSolicita.slice(), notas:canalizacionNotas, filtro:canalizacionFiltro });
      const alumnoCanal = state.alumnos.find(x=>x.id===reportAlumno);
      doPrint(printTableStyleTag() + buildCanalizacionHTML(reportAlumno, folio, fecha, obsIncluidas, canalizacionSolicita, canalizacionNotas),
        `Canalizacion_TrabajoSocial_${limpiarNombreArchivo(alumnoCanal?alumnoCanal.nombre:'')}_${folio}`);
      toast('Canalización registrada — folio ' + folio);
      canalizacionSolicita = []; canalizacionNotas = ''; canalizacionFiltro = 'todas'; canalizacionDesde=''; canalizacionHasta='';
      renderReportes(el);
    } else {
      const g = `${state.config.grado}${state.config.grupo}`;
      const nombreAl = ()=> { const al = state.alumnos.find(x=>x.id===reportAlumno); return al?limpiarNombreArchivo(al.nombre):'Alumno'; };
      const fichaAlcanceTxt = fichaScope==='momento' ? limpiarNombreArchivo(state.config.momentos[fichaMomentoSel].nombre) : fichaScope==='fecha' ? 'Rango' : 'General';
      const nombresPorTipo = {
        general: `Informe_General_${g}_${todayISO()}`,
        parcial: `Informe_Parcial_${limpiarNombreArchivo(state.config.momentos[reportMomento].nombre)}_${g}_${todayISO()}`,
        individual: `Ficha_Tecnica_${nombreAl()}_${fichaAlcanceTxt}_${g}_${todayISO()}`,
        padres: `Boletin_Padres_${nombreAl()}_${g}_${todayISO()}`,
        traspaso: `Traspaso_Continuidad_${g}_${todayISO()}`,
      };
      doPrint(printTableStyleTag() + preview.innerHTML, nombresPorTipo[reportTipo] || `Reporte_${g}_${todayISO()}`);
    }
  });
}

/* ---- Importar / Exportar ---- */
function origenLabel(tipo){
  return { nuevo:'Grupo creado en blanco dentro de la app', ejemplo:'Datos de ejemplo cargados dentro de la app',
    csv:'Importado desde un archivo CSV', json:'Restaurado desde un respaldo JSON',
    desconocido:'Sin registro (grupo creado en una versión anterior de la app)' }[tipo] || tipo;
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
  return `${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}, ${hh}:${mm}`;
}

function renderIO(el){
  const origen = state.meta.origen || {tipo:'desconocido', nombreArchivo:null, fecha:null};
  const historial = state.meta.historialArchivos || [];
  el.innerHTML = `
  <div class="card" style="margin-bottom:18px; background:var(--primary-tint); border-color:var(--primary-tint);">

    <p style="font-size:13px; color:var(--primary-dark); line-height:1.6; margin-bottom:0;">
      Esta información <b>no vive en un archivo de Excel o CSV</b> en tu computadora — vive en la memoria interna de <b>este navegador, en este dispositivo</b> (lo que se llama "almacenamiento local"). Los archivos CSV y JSON solo se usan cuando tú decides <b>exportar</b> (sacar una copia) o <b>importar</b> (traer datos de un archivo hacia aquí). Si cambias de navegador, de celular o borras los datos de navegación, esta información no viajará sola — por eso conviene exportar un respaldo de vez en cuando.
    </p>
  </div>

  <div class="grid grid-2" style="margin-bottom:18px;">
    <div class="card">
      <h3 style="font-size:14.5px;margin-bottom:8px;">Origen de este grupo</h3>
      <p style="font-size:13px; margin-bottom:4px;"><b>${origenLabel(origen.tipo)}</b></p>
      ${origen.nombreArchivo? `<p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:2px;">Archivo: <code>${esc(origen.nombreArchivo)}</code></p>` : ''}
      <p style="font-size:12px; color:var(--ink-faint); margin-bottom:0;">${fmtDateTime(origen.fecha)}</p>
    </div>
    <div class="card">
      <h3 style="font-size:14.5px;margin-bottom:8px;">Guardado automático</h3>
      <p style="font-size:13px; margin-bottom:2px;">Navegador y dispositivo actuales · almacenamiento local del navegador</p>
      <p style="font-size:12px; color:var(--ink-faint); margin-bottom:0;">Último guardado: ${fmtDateTime(state.meta.lastSaved)}</p>
    </div>
  </div>

  <div class="card" style="margin-bottom:18px;">
    <h3 style="font-size:14.5px;margin-bottom:2px;">Historial de archivos de este grupo</h3>

    ${historial.length? `<div class="table-wrap"><table>
      <thead><tr><th>Fecha</th><th>Acción</th><th>Archivo</th></tr></thead>

  <div class="grid grid-2">

      <div class="btnrow" style="flex-direction:column; align-items:stretch;">

        <button class="btn" id="expCondensado"><svg><use href="#ic-file"/></svg>Descargar condensado por momento (CSV)</button>
        <button class="btn" id="expBitacora"><svg><use href="#ic-file"/></svg>Descargar bitácora de observaciones (CSV)</button>
        <button class="btn" id="expAsistencia"><svg><use href="#ic-file"/></svg>Descargar registro de asistencia (CSV)</button>

      <p style="font-size:12px;color:var(--ink-soft); margin-top:8px;">Si el archivo es de un solo grupo, se restaura sobre el grupo activo. Si es un respaldo de "todos los grupos", <b>reemplaza la lista completa de grupos</b> de este dispositivo.</p>

    <button class="btn btn-danger" id="resetAll"><svg><use href="#ic-trash"/></svg>Borrar este grupo y empezar de nuevo</button>
  </div>`;

  document.getElementById('expTodo').addEventListener('click', ()=>{
    const sufijo = `${state.config.grado}${state.config.grupo}_${marcaTiempoArchivo()}`;

      { fn:`registro_${sufijo}.csv`, contenido: exportCSV(), evento:'Exportado — mis datos (CSV)' },

  document.getElementById('expCSV').addEventListener('click', ()=>{

    renderIO(el);

  document.getElementById('expBitacora').addEventListener('click', ()=>{
    const fn = `bitacora_${state.config.grado}${state.config.grupo}_${marcaTiempoArchivo()}.csv`;

    logFileEvent('Exportado — bitácora de observaciones (CSV)', fn);
    renderIO(el);

  document.getElementById('expAsistencia').addEventListener('click', ()=>{

  });
  document.getElementById('expJSON').addEventListener('click', ()=>{
    const fn = `respaldo_${appData.groups[appData.activeGroupId].label.replace(/[^a-z0-9]+/gi,'_')}_${marcaTiempoArchivo()}.json`;
    downloadText(fn, JSON.stringify(state,null,2), 'application/json');
    logFileEvent('Exportado — respaldo de este grupo (JSON)', fn);
    renderIO(el);
  });
  document.getElementById('expJSONTodo').addEventListener('click', ()=>{
    const fn = `respaldo_TODOS_LOS_GRUPOS_${marcaTiempoArchivo()}.json`;
    downloadText(fn, JSON.stringify(appData,null,2), 'application/json');
    logFileEvent('Exportado — respaldo de todos los grupos (JSON)', fn);
    renderIO(el);
  });

  const csvInput = document.getElementById('csvFile');
  const importBtn = document.getElementById('doImportCSV');
  let pendingText = null;
  let pendingFileName = null;
  csvInput.addEventListener('change', ()=>{
    const f = csvInput.files[0];
    importBtn.disabled = !f;
    if(f){ pendingFileName = f.name; const r = new FileReader(); r.onload = ()=>{ pendingText = r.result; }; r.readAsText(f); }
  });
  importBtn.addEventListener('click', ()=>{
    if(!pendingText){ toast('Selecciona un archivo primero'); return; }
    const asNew = document.getElementById('importAsNewGroup').checked;
    if(asNew){
      createGroup(blankState(), 'Grupo importado ' + fmtDate(todayISO()));
      currentTab = 'datosio';
    }
    const res = importCSVText(pendingText);
    setOrigen('csv', pendingFileName);
    logFileEvent('Importado CSV', pendingFileName);
    toast(res.msg); renderAll();
  });

  document.getElementById('jsonFile').addEventListener('change', ()=>{
    const inputEl = document.getElementById('jsonFile');
    const f = inputEl.files[0];
    if(!f) return;
    const nombreArchivo = f.name;
    const r = new FileReader();
    r.onload = ()=>{
      let parsed;
      try{ parsed = JSON.parse(r.result); }
      catch(e){ toast('El archivo no es un respaldo válido'); inputEl.value=''; return; }

      const esTodosLosGrupos = parsed && parsed.groups && parsed.activeGroupId && parsed.groups[parsed.activeGroupId];
      const esUnGrupo = parsed && parsed.config && Array.isArray(parsed.alumnos);

      if(esTodosLosGrupos){
        const n = Object.keys(parsed.groups).length;
        if(!confirm(`Este archivo contiene ${n} grupo(s) y reemplazará TODA la lista de grupos guardada en este dispositivo (no solo el grupo activo). ¿Continuar?`)){ inputEl.value=''; return; }
        Object.values(parsed.groups).forEach(g=> ensureShape(g.state));
        appData = parsed;
        state = appData.groups[appData.activeGroupId].state;
        reportAlumno = null; canalizacionSolicita=[]; canalizacionNotas=''; canalizacionFiltro='todas'; canalizacionDesde=''; canalizacionHasta='';
        fichaScope='general'; fichaMomentoSel=0; fichaDesde=''; fichaHasta='';
        logFileEvent('Restaurado — todos los grupos (JSON)', nombreArchivo);
        saveState(); toast(`Restaurados ${n} grupo(s)`); currentTab='inicio'; renderAll();
      } else if(esUnGrupo){
        if(!confirm('Esto reemplazará todos los datos del grupo activo con el respaldo. ¿Continuar?')){ inputEl.value=''; return; }
        ensureShape(parsed);
        state = parsed;
        setOrigen('json', nombreArchivo);
        logFileEvent('Restaurado — este grupo (JSON)', nombreArchivo);
        saveState(); toast('Respaldo restaurado'); renderAll();
      } else {
        toast('El archivo no tiene un formato de respaldo reconocido');
      }
      inputEl.value = '';
    };
    r.readAsText(f);
  });

  document.getElementById('resetAll').addEventListener('click', ()=>{
    if(!confirm(`¿Seguro que quieres borrar los datos del grupo "${appData.groups[appData.activeGroupId].label}"? Esta acción no se puede deshacer.`)) return;
    if(!confirm('Confirma una vez más: se perderán todos los alumnos y calificaciones de este grupo. Tus otros grupos no se verán afectados.')) return;
    const g = appData.groups[appData.activeGroupId];
    const fresh = blankState();
    g.state = fresh; state = fresh;
    if(!g.customLabel) g.label = labelForState(fresh);
    saveState(); currentTab='inicio'; renderAll(); toast('Grupo reiniciado');
  });
}

/* ---------------- modal helpers ---------------- */
function openModal(html, wide){
  document.getElementById('modalBox').className = 'modal'+(wide?' wide':'');
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('modalBox').querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* manual save button */
document.getElementById('manualSaveBtn').addEventListener('click', ()=>{ saveState(); });
document.getElementById('fabQuickObs').addEventListener('click', openGlobalQuickObs);

/* ---------------- onboarding ---------------- */
let onbStep = 1;
function showOnboarding(){
  document.getElementById('onboarding').style.display='flex';
  onbStep = 1; renderOnbStep();
}
function hideOnboarding(){ document.getElementById('onboarding').style.display='none'; }

function renderOnbStep(){
  document.querySelectorAll('.onb-step').forEach(s=> s.classList.toggle('done', Number(s.dataset.s)<=onbStep));
  const body = document.getElementById('onb-body');
  if(onbStep===1){
    body.innerHTML = `
      <h2 style="font-size:22px;">Bienvenido(a) 👋</h2>
      <p style="color:var(--ink-soft); font-size:14.5px; line-height:1.6; margin:10px 0 22px;">
      Esta aplicación te ayuda a llevar el registro de evaluación continua de tus grupos: calificaciones, altas y bajas de alumnos, observaciones académicas y conductuales, estadísticas, alertas de riesgo de reprobación y reportes listos para imprimir. Puedes tener varios grupos o materias a la vez y cambiar entre ellos con un clic. Todo se guarda solo en este dispositivo.</p>
      <div class="btnrow" style="justify-content:flex-end;"><button class="btn btn-primary" id="onb-next1">Comenzar</button></div>`;
    document.getElementById('onb-next1').addEventListener('click', ()=>{ onbStep=2; renderOnbStep(); });
  } else if(onbStep===2){
    body.innerHTML = `
      <h2 style="font-size:20px;">¿Cómo quieres empezar?</h2>
      <p style="color:var(--ink-soft); font-size:14px; margin:8px 0 20px;">Puedes cargar un grupo de ejemplo (2°F, con datos reales de referencia) para explorar la aplicación, o empezar completamente en blanco con tu propio grupo.</p>
      <div class="btnrow" style="flex-direction:column; align-items:stretch;">
        <button class="btn btn-primary" id="onb-example">Explorar con datos de ejemplo</button>
        <button class="btn" id="onb-blank">Empezar en blanco con mi grupo</button>
      </div>`;
    document.getElementById('onb-example').addEventListener('click', ()=>{ createGroup(buildExampleState()); onbStep=4; renderOnbStep(); });
    document.getElementById('onb-blank').addEventListener('click', ()=>{ createGroup(blankState()); onbStep=3; renderOnbStep(); });
  } else if(onbStep===3){
    body.innerHTML = `
      <h2 style="font-size:20px;">Datos de tu grupo</h2>
      <p style="color:var(--ink-soft); font-size:13.5px; margin:6px 0 16px;">Puedes ajustar todo esto después en "Datos y ciclo". Solo lo esencial por ahora:</p>
      <div class="field"><label>Profesor(a)</label><input type="text" id="onb-prof" value=""></div>
      <div class="field"><label>Asignatura</label><input type="text" id="onb-asig" value=""></div>
      <div class="grid grid-2"><div class="field"><label>Grado</label><input type="text" id="onb-grado" value=""></div><div class="field"><label>Grupo</label><input type="text" id="onb-grupo" value=""></div></div>
      <div class="btnrow" style="justify-content:flex-end;"><button class="btn btn-primary" id="onb-next3">Continuar</button></div>`;
    document.getElementById('onb-next3').addEventListener('click', ()=>{
      state.config.profesor = document.getElementById('onb-prof').value;
      state.config.asignatura = document.getElementById('onb-asig').value;
      state.config.grado = document.getElementById('onb-grado').value;
      state.config.grupo = document.getElementById('onb-grupo').value;
      saveState(true); onbStep=4; renderOnbStep();
    });
  } else if(onbStep===4){
    body.innerHTML = `
      <h2 style="font-size:20px;">¡Todo listo! ✅</h2>
      <p style="color:var(--ink-soft); font-size:14px; margin:8px 0 20px; line-height:1.6;">
      Usa el menú lateral (o inferior en tu celular) para moverte entre secciones. Arriba encontrarás el selector de "Grupo" — ahí puedes crear, renombrar o cambiar entre distintos grupos o materias cuando lo necesites. Tus cambios se guardan automáticamente; si cierras la ventana con cambios muy recientes, el navegador te avisará para que no pierdas nada.</p>
      <div class="btnrow" style="justify-content:flex-end;"><button class="btn btn-primary" id="onb-finish">Ir a mi panel</button></div>`;
    document.getElementById('onb-finish').addEventListener('click', ()=>{ hideOnboarding(); renderAll(); });
  }
}

/* ---------------- init ---------------- */
(function init(){
  appData = loadApp();
  if(appData){
    state = appData.groups[appData.activeGroupId].state;
    lastSavedAt = state.meta && state.meta.lastSaved ? new Date(state.meta.lastSaved) : null;
    renderAll();
  } else {
    appData = { activeGroupId:null, groups:{} };
    showOnboarding();
  }
})();
</script>
</body>
