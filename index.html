<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Registro de Evaluación Continua · 2°F</title>
<style>
:root{
  --bg:#F5F8F6;
  --surface:#FFFFFF;
  --surface-2:#EEF3F0;
  --line:#DCE6E0;
  --ink:#1E2A26;
  --ink-soft:#5C6D66;
  --ink-faint:#8A9994;
  --primary:#2F6F63;
  --primary-dark:#22524A;
  --primary-tint:#E3EFEA;
  --amber:#B9791F;
  --amber-tint:#FBF1DF;
  --brick:#B8503F;
  --brick-tint:#FBE9E5;
  --good:#3E8C63;
  --good-tint:#E6F3EA;
  --violet:#6E5B9E;
  --violet-tint:#EDE9F6;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(30,42,38,.06), 0 4px 16px rgba(30,42,38,.05);
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:"Fraunces","Georgia",serif; font-weight:600; margin:0 0 4px; letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit; font-size:15px;}
::selection{background:var(--primary-tint);}

/* ---------- App shell ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:230px; flex-shrink:0; background:var(--surface);
  border-right:1px solid var(--line); padding:22px 14px;
  display:flex; flex-direction:column; gap:2px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 10px 20px;}
.brand-badge{width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-weight:700;font-size:17px;flex-shrink:0;}
.brand-text{line-height:1.15;}
.brand-text b{display:block;font-size:14.5px;color:var(--ink);}
.brand-text span{font-size:11.5px;color:var(--ink-faint);}

.navitem{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-sm);
  color:var(--ink-soft); cursor:pointer; font-size:14.5px; font-weight:600; border:none; background:none;
  text-align:left; width:100%; position:relative;
}
.navitem svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;}
.navitem:hover{background:var(--surface-2); color:var(--ink);}
.navitem.active{background:var(--primary-tint); color:var(--primary-dark);}
.navitem .badge{margin-left:auto; background:var(--brick); color:#fff; font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px;}
.nav-sep{height:1px; background:var(--line); margin:12px 6px;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.groupbar{
  display:flex; align-items:center; gap:10px; padding:9px 28px; background:var(--surface-2);
  border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.groupbar label{margin:0; text-transform:none; font-size:12px; font-weight:700; color:var(--ink-soft); letter-spacing:0;}
.groupbar select{width:auto; max-width:260px; font-weight:700; padding:6px 10px;}
.topbar{
  display:flex; align-items:center; gap:14px; justify-content:space-between;
  padding:14px 28px; border-bottom:1px solid var(--line); background:rgba(245,248,246,.9);
  backdrop-filter:blur(6px); position:sticky; top:0; z-index:20; flex-wrap:wrap; row-gap:8px;
}
.topbar-left{display:flex; flex-direction:column;}
.topbar-left .eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:700;}
.topbar-left h2{font-size:19px;}
.topbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.save-info{font-size:12px; font-weight:700; display:flex; align-items:center; gap:5px; white-space:nowrap;}
.momento-pill{font-size:12.5px; font-weight:700; background:var(--primary-tint); color:var(--primary-dark); padding:6px 12px; border-radius:20px; white-space:nowrap;}

.content{padding:26px 28px 90px; max-width:1180px; width:100%; margin:0 auto;}
.hint{font-size:14px; color:var(--ink-soft); margin-bottom:20px; max-width:70ch; line-height:1.5;}

/* ---------- shared components ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px;}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

.stat-card{display:flex; flex-direction:column; gap:6px;}
.stat-card .stat-label{font-size:12px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.stat-card .stat-value{font-family:"Fraunces",serif; font-size:32px; font-weight:600;}
.stat-card .stat-sub{font-size:12.5px; color:var(--ink-faint);}
.stat-card.warn .stat-value{color:var(--brick);}
.stat-card.good .stat-value{color:var(--primary);}

.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:14px;
  cursor:pointer; transition:.15s; white-space:nowrap;
}
.btn:hover{border-color:var(--primary); color:var(--primary-dark);}
.btn svg{width:16px;height:16px; stroke:currentColor;}
.btn-primary{background:var(--primary); border-color:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark); color:#fff;}
.btn-danger{background:var(--brick-tint); border-color:var(--brick-tint); color:var(--brick);}
.btn-danger:hover{background:var(--brick); color:#fff; border-color:var(--brick);}
.btn-ghost{background:none; border-color:transparent;}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btnrow{display:flex; gap:10px; flex-wrap:wrap;}

label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
.field{margin-bottom:14px;}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); outline:none;
}
textarea{resize:vertical; min-height:70px;}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint);}
input[type=number].grade-input{text-align:center; padding:7px 4px; font-weight:700;}

table{border-collapse:collapse; width:100%; font-size:14px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); padding:8px 10px; border-bottom:2px solid var(--line); white-space:nowrap;}
td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--line);}
.table-wrap table{background:var(--surface);}

.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap;}
.chip-good{background:var(--good-tint); color:var(--good);}
.chip-warn{background:var(--amber-tint); color:var(--amber);}
.chip-bad{background:var(--brick-tint); color:var(--brick);}
.chip-muted{background:var(--surface-2); color:var(--ink-faint);}
.chip-violet{background:var(--violet-tint); color:var(--violet);}

.pill-tabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.pill-tab{padding:8px 16px; border-radius:20px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:13.5px; cursor:pointer; color:var(--ink-soft);}
.pill-tab.active{background:var(--primary); border-color:var(--primary); color:#fff;}

.section{display:none;}
.section.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.section-title{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; flex-wrap:wrap;}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(20,28,25,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--surface); border-radius:16px; padding:24px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.wide{max-width:760px;}
.modal-close{float:right; background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:20px; line-height:1;}

/* onboarding */
.onb{position:fixed; inset:0; background:var(--bg); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px;}
.onb-card{max-width:560px; width:100%; background:var(--surface); border-radius:20px; box-shadow:var(--shadow); padding:36px; border:1px solid var(--line);}
.onb-steps{display:flex; gap:6px; margin-bottom:20px;}
.onb-step{height:5px; flex:1; background:var(--line); border-radius:4px;}
.onb-step.done{background:var(--primary);}

/* charts */
.barchart{width:100%; height:auto;}

/* risk cards */
.risk-card{border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; background:var(--surface); display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:10px; flex-wrap:wrap;}
.risk-name{font-weight:700; font-size:14.5px;}
.risk-reasons{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}

/* observaciones */
.obs-item{border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 13px; margin-bottom:8px; background:var(--surface-2);}
.obs-meta{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--ink-faint); margin-bottom:5px; gap:8px; flex-wrap:wrap;}
.obs-text{font-size:13.5px; line-height:1.45;}

/* toast */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 20px; border-radius:30px; font-size:13.5px; font-weight:600; z-index:300; opacity:0; pointer-events:none; transition:.3s;}

.fab{
  position:fixed; right:24px; bottom:28px; width:54px; height:54px; border-radius:50%;
  background:var(--primary); color:#fff; border:none; box-shadow:0 6px 16px rgba(47,111,99,.35);
  font-size:22px; cursor:pointer; z-index:60; display:flex; align-items:center; justify-content:center;
  transition:transform .15s;
}
.fab:hover{transform:scale(1.06); background:var(--primary-dark);}
@media(max-width:840px){
  .fab{ right:16px; bottom:calc(66px + env(safe-area-inset-bottom)); width:48px; height:48px; font-size:19px; }
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

/* mobile bottom nav */
.bottomtabs{display:none;}
@media(max-width:840px){
  .sidebar{display:none;}
  .bottomtabs{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line);
    z-index:50; overflow-x:auto; padding:4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .bottomtabs .navitem{flex-direction:column; font-size:10px; gap:3px; padding:7px 6px; min-width:58px; text-align:center; align-items:center;}
  .bottomtabs .navitem .badge{position:absolute; margin-left:14px; margin-top:-14px;}
  .content{padding-bottom:96px;}
  .grid-4,.grid-3{grid-template-columns:repeat(2,1fr); gap:10px;}
  .grid-2{grid-template-columns:1fr; gap:12px;}

  /* Barra superior compacta: solo lo esencial visible, sin amontonarse */
  .topbar{padding:10px 14px; gap:8px;}
  .topbar-left .eyebrow{display:none;}
  .topbar-left h2{font-size:16px;}
  .save-info{font-size:11px;}
  #manualSaveBtn{padding:6px 10px; font-size:12px;}
  .momento-pill{display:none;}

  /* Barra de grupo compacta */
  .groupbar{padding:8px 14px; gap:8px;}
  .groupbar select{max-width:150px; font-size:13px;}

  .content{padding:16px 14px 96px;}
  .card{padding:14px 16px;}
  .stat-card .stat-value{font-size:24px;}
  .hint{font-size:13px; margin-bottom:14px;}

  .sticky-cols td, .sticky-cols th{padding:6px 5px;}
  .sticky-cols .grade-input{width:50px !important;}
  .sticky-cols th:nth-child(2), .sticky-cols td:nth-child(2){min-width:96px; font-size:13px;}
}

/* Teléfono en horizontal: la altura visible es muy poca, se reduce el "chrome" fijo */
@media(max-height:480px) and (orientation:landscape){
  .topbar{padding:6px 14px;}
  .topbar-left h2{font-size:14px;}
  .groupbar{padding:5px 14px;}
  .bottomtabs .navitem{padding:4px 6px; font-size:9px;}
  .card{padding:12px 14px;}
}

/* Teléfonos muy angostos: hasta las tarjetas pequeñas de estadísticas se apilan en una sola columna */
@media(max-width:400px){
  .grid-4,.grid-3{grid-template-columns:1fr;}
}

.empty{text-align:center; padding:40px 20px; color:var(--ink-faint);}
.empty svg{width:44px;height:44px; stroke:var(--ink-faint); margin-bottom:10px;}

.helpbox{background:var(--primary-tint); border-radius:var(--radius-sm); padding:12px 16px; font-size:13.5px; color:var(--primary-dark); margin-bottom:18px; display:flex; gap:10px; align-items:flex-start;}
.helpbox svg{width:17px;height:17px; flex-shrink:0; margin-top:1px;}

.weight-warn{color:var(--brick); font-weight:700; font-size:12.5px;}
.weight-ok{color:var(--good); font-weight:700; font-size:12.5px;}

/* Aspectos evaluados: acrónimo con color + leyenda. Se usa tanto en pantalla como al imprimir. */
.crit-badge{display:inline-block; min-width:26px; text-align:center; padding:2px 7px; border-radius:5px; font-size:10px; font-weight:800; letter-spacing:.02em;}
.crit-legend{margin:4px 0 18px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); font-size:10.5px; color:var(--ink); overflow-x:auto;}
.crit-legend b{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); display:block; margin-bottom:6px;}
.crit-legend table{width:auto; border-collapse:separate; border-spacing:0;}
.crit-legend td{padding:0; border:none;}

/* Tabla de calificaciones: el No. y el nombre del alumno quedan fijos al hacer scroll horizontal,
   para no perder de vista a quién le estás capturando la calificación (clave en pantallas de celular). */
.sticky-cols th:nth-child(1), .sticky-cols td:nth-child(1){ position:sticky; left:0; z-index:3; background:var(--surface); width:34px; min-width:34px; }
.sticky-cols th:nth-child(2), .sticky-cols td:nth-child(2){ position:sticky; left:34px; z-index:3; background:var(--surface); box-shadow:2px 0 4px rgba(30,42,38,.06); min-width:120px; }
.sticky-cols th:nth-child(1), .sticky-cols th:nth-child(2){ z-index:4; }

/* ---- Print isolation: only #printRoot is shown when printing ---- */
#printRoot{display:none;}
@media print{
  body > *:not(#printRoot){ display:none !important; }
  #printRoot{ display:block !important; position:static; width:100%; padding:12px; margin:0; }
  .no-print{display:none !important;}
  @page{ margin:1.3cm 1.2cm 1.9cm; }
  .print-page-footer{ position:fixed; bottom:0.15cm; left:0; right:0; text-align:center; font-size:9px; color:#8A9994; }
  .print-page-footer::after{ content:" · Página " counter(page); }
}
</style>
</head>
<body>

<div id="onboarding" class="onb" style="display:none;">
  <div class="onb-card">
    <div class="onb-steps">
      <div class="onb-step" data-s="1"></div><div class="onb-step" data-s="2"></div>
      <div class="onb-step" data-s="3"></div><div class="onb-step" data-s="4"></div>
    </div>
    <div id="onb-body"></div>
  </div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <div class="groupbar no-print" id="groupbar"></div>
    <div class="topbar">
      <div class="topbar-left">
        <span class="eyebrow" id="tb-eyebrow">Ciclo escolar</span>
        <h2 id="tb-title">Inicio</h2>
      </div>
      <div class="topbar-right no-print">
        <span class="save-info" id="saveInfo">✓ Guardado</span>
        <button class="btn btn-sm" id="manualSaveBtn">Guardar ahora</button>
        <span class="momento-pill" id="momentoPill">—</span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

  <nav class="bottomtabs" id="bottomtabs"></nav>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<button class="fab no-print" id="fabQuickObs" title="Nueva observación rápida">✏️</button>
<div id="printRoot"></div>

<!-- icon symbols -->
<svg width="0" height="0" style="position:absolute">
<symbol id="ic-home" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></symbol>
<symbol id="ic-settings" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4M6.3 17.7l1.4-1.4m8.6-8.6 1.4-1.4"/></symbol>
<symbol id="ic-users" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5"/><circle cx="17.5" cy="8.5" r="2.6"/><path d="M15.7 13.6c2.9.4 4.8 2.3 4.8 5"/></symbol>
<symbol id="ic-grades" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
<symbol id="ic-chart" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M2 20h20"/></symbol>
<symbol id="ic-alert" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 9.5v4.2"/><circle cx="12" cy="16.7" r=".4" fill="currentColor"/></symbol>
<symbol id="ic-file" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6Z"/><path d="M14 2v6h6"/></symbol>
<symbol id="ic-upload" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 17v3h16v-3"/></symbol>
<symbol id="ic-plus" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="ic-info" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="8" r=".4" fill="currentColor"/></symbol>
<symbol id="ic-print" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="1"/><path d="M6 14h12v7H6Z"/></symbol>
<symbol id="ic-trash" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13"/></symbol>
<symbol id="ic-edit" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.3V20h2.7L18 8.7l-2.7-2.7Z"/><path d="M14 5.5 18.5 10"/></symbol>
<symbol id="ic-note" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5Z"/><path d="M8 9h8M8 13h8M8 17h5"/></symbol>
<symbol id="ic-eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="ic-calendar" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m8.5 14.5 2 2 4.5-4.5"/></symbol>
</svg>

<script>
/* =========================================================================
   REGISTRO DE EVALUACIÓN CONTINUA — app de una sola página, sin dependencias
   ========================================================================= */

const todayISO = () => {

/* ---------------- migración de estados guardados con versiones anteriores ---------------- */
function ensureShape(s){
  if(!s.observaciones) s.observaciones = {};
  if(!s.fichaGrupal) s.fichaGrupal = {};
  if(!s.entregas) s.entregas = {};
  if(!s.canalizaciones) s.canalizaciones = {};
  if(!s.asistencia || !Array.isArray(s.asistencia.dias)) s.asistencia = {dias:[], faltas:{}};
  if(!s.asistencia.faltas) s.asistencia.faltas = {};
  if(!s.meta) s.meta = {createdAt:todayISO(), lastSaved:null};
  if(!s.meta.origen) s.meta.origen = {tipo:'desconocido', nombreArchivo:null, fecha:s.meta.createdAt||todayISO()};
  if(!s.meta.historialArchivos) s.meta.historialArchivos = [];
  if(s.config && s.config.umbralCanalizacion===undefined) s.config.umbralCanalizacion = 3;
  if(s.config && s.config.escuela === 'ESCUELA SECUNDARIA GENERAL N°. 7 "PROFR. ELEAZAR CERVANTES GÓMEZ"'){
    s.config.escuela = 'ESCUELA SECUNDARIA GENERAL N°. 7 "ELEAZAR CERVANTES GÓMEZ"';
  }
  [0,1,2].forEach(i=>{ if(!s.fichaGrupal[i]) s.fichaGrupal[i] = {fortalezas:'',areas:'',notasApoyo:''}; });
  if(s.config && Array.isArray(s.config.momentos)){
    // Migración crítica: los criterios de evaluación eran globales (compartidos entre los 3 momentos).
    // Si un profesor los cambiaba para el momento 2, esto alteraba retroactivamente lo ya capturado en el momento 1.
    // Cada momento ahora tiene su propia lista de criterios independiente; si el archivo viene de una versión
    // anterior con un solo arreglo global, se copia ese arreglo (tal cual estaba) a cada momento para no perder
    // ni alterar ninguna calificación ya registrada.
    const criteriosGlobalAnterior = Array.isArray(s.config.criterios) ? s.config.criterios : null;
    s.config.momentos.forEach(m=>{
      if(m.contenido===undefined) m.contenido='';
      if(m.pda===undefined) m.pda='';
      if(m.sesiones===undefined) m.sesiones=null;
      if(!Array.isArray(m.criterios) || !m.criterios.length){
        m.criterios = criteriosGlobalAnterior
          ? JSON.parse(JSON.stringify(criteriosGlobalAnterior))
          : [{nombre:'Cuaderno', peso:40},{nombre:'Portafolio', peso:20},{nombre:'Examen', peso:20},{nombre:'Proyecto', peso:20}];
      }
    });
    delete s.config.criterios;
  }
  return s;
}

/* ---------------- multi-grupo: la app guarda varios grupos y trabaja sobre el "activo" ---------------- */
const APP_KEY = 'rdd_eval_app_grupos_v1';
let appData = null; // { activeGroupId, groups: { id: {id, label, customLabel, state} } }
let state = null;   // referencia directa al state del grupo activo (appData.groups[activeGroupId].state)

function labelForState(s){
  const c = s.config || {};
  const partes = [];
  if(c.grado || c.grupo) partes.push(`${c.grado||'—'}°${c.grupo||''}`.trim());
  if(c.asignatura) partes.push(c.asignatura);
  return partes.length ? partes.join(' · ') : 'Grupo sin nombre';
}
function newGroupEntry(groupState){
  return { id: uid(), label: labelForState(groupState), customLabel:false, state: groupState };
}
function loadApp(){
  try{
    const raw = localStorage.getItem(APP_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      Object.values(parsed.groups||{}).forEach(g=> ensureShape(g.state));
      if(parsed.activeGroupId && parsed.groups && parsed.groups[parsed.activeGroupId]) return parsed;
    }
  }catch(e){ console.warn('No se pudo leer almacenamiento de grupos', e); }
  // migración desde la versión anterior de un solo grupo
  try{
    const oldRaw = localStorage.getItem(STORAGE_KEY);
    if(oldRaw){
      const oldState = ensureShape(JSON.parse(oldRaw));
      const entry = newGroupEntry(oldState);
      return { activeGroupId: entry.id, groups: { [entry.id]: entry } };
    }
  }catch(e){ console.warn('No se pudo migrar el almacenamiento anterior', e); }
  return null;
}

let dirty = false;
let autosaveTimer = null;
let lastSavedAt = null;

function markDirty(){
  dirty = true;
  updateSaveIndicator();
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>{ saveState(true); }, 700);
}

function saveState(silent){
  if(state && state.meta) state.meta.lastSaved = new Date().toISOString();
  if(appData && appData.activeGroupId && appData.groups[appData.activeGroupId]){
    const g = appData.groups[appData.activeGroupId];
    g.state = state;
    if(!g.customLabel) g.label = labelForState(state);
  }
  localStorage.setItem(APP_KEY, JSON.stringify(appData));
  dirty = false;
  lastSavedAt = new Date();
  updateSaveIndicator();
  if(!silent) toast('Guardado ✓');
}

/* Registra en qué archivo se guardó o de cuál se extrajo la información, para que el profesor siempre sepa el origen de sus datos */
function logFileEvent(accion, archivo){
  if(!state.meta.historialArchivos) state.meta.historialArchivos = [];
  state.meta.historialArchivos.unshift({ fecha: new Date().toISOString(), accion, archivo: archivo || null });
  state.meta.historialArchivos = state.meta.historialArchivos.slice(0, 20);
  saveState(true);
}
function setOrigen(tipo, nombreArchivo){
  state.meta.origen = { tipo, nombreArchivo: nombreArchivo || null, fecha: new Date().toISOString() };
}

function updateSaveIndicator(){
  const el = document.getElementById('saveInfo');
  if(!el) return;
  if(dirty){
    el.textContent = '● Guardando…';
    el.style.color = 'var(--amber)';
  } else if(lastSavedAt){
    const secs = Math.max(0, Math.round((Date.now()-lastSavedAt.getTime())/1000));
    el.textContent = secs<3 ? '✓ Guardado' : (secs<60 ? `✓ Guardado hace ${secs}s` : `✓ Guardado hace ${Math.round(secs/60)} min`);
    el.style.color = 'var(--good)';
  } else {
    el.textContent = 'Sin cambios aún';
    el.style.color = 'var(--ink-faint)';
  }
}
setInterval(updateSaveIndicator, 5000);
setInterval(()=>{ if(state && state.alumnos && state.alumnos.length){ saveState(true); } }, 25000);

/* ---------------- cambiar / crear / renombrar / eliminar grupos ---------------- */
function switchGroup(id){
  if(!appData.groups[id] || id===appData.activeGroupId) return;
  appData.activeGroupId = id;
  state = appData.groups[id].state;
  lastSavedAt = state.meta && state.meta.lastSaved ? new Date(state.meta.lastSaved) : null;
  reportAlumno = null; // evita referenciar a un alumno del grupo anterior
  canalizacionSolicita = []; canalizacionNotas = ''; canalizacionFiltro='todas'; canalizacionDesde=''; canalizacionHasta='';
  fichaScope='general'; fichaMomentoSel=0; fichaDesde=''; fichaHasta='';
  saveState(true);
  currentTab = 'inicio';
  renderAll();
  toast(`Cambiaste a ${appData.groups[id].label}`);
}
function createGroup(groupState, label){
  const entry = newGroupEntry(groupState);
  if(label){ entry.label = label; entry.customLabel = true; }
  appData.groups[entry.id] = entry;
  appData.activeGroupId = entry.id;
  state = entry.state;
  reportAlumno = null;
  canalizacionSolicita = []; canalizacionNotas = ''; canalizacionFiltro='todas'; canalizacionDesde=''; canalizacionHasta='';
  fichaScope='general'; fichaMomentoSel=0; fichaDesde=''; fichaHasta='';
  saveState(true);
  return entry;
}
function deleteActiveGroup(){
  const ids = Object.keys(appData.groups);
  if(ids.length<=1){ toast('Debe existir al menos un grupo'); return; }
  delete appData.groups[appData.activeGroupId];
  const nextId = Object.keys(appData.groups)[0];
  switchGroup(nextId);
  toast('Grupo eliminado');
}


function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* -------- reminder before closing the tab/window -------- */
window.addEventListener('beforeunload', function(e){
  if(dirty){
    try{ saveState(true); }catch(err){}
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
// Extra layer: if the tab loses focus/visibility while there are unsaved changes, force-save immediately.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden' && dirty){ saveState(true); }
});

/* ---------------- domain calculations ---------------- */
function activeStudents(){ return state.alumnos.filter(a=>a.status==='activo'); }

function studentAppliesToMomento(alumno, momento){
  if(alumno.fechaAlta && momento.fin && alumno.fechaAlta > momento.fin) return false;
  if(alumno.fechaBaja && momento.inicio && alumno.fechaBaja < momento.inicio) return false;
  return true;
}

function criteriosDe(idx){ return state.config.momentos[idx].criterios; }
function pesoTotal(idx){ return criteriosDe(idx).reduce((s,c)=>s+Number(c.peso||0),0); }

function calcMomentoFinal(alumnoId, idx){
  const rec = state.calificaciones[alumnoId];
  const g = rec ? rec[idx] : null;
  if(!g) return null;
  const criterios = criteriosDe(idx);
  let sum=0, pesoUsado=0, any=false;
  criterios.forEach(c=>{
    const v = g[c.nombre];
    if(v!==undefined && v!==null && v!==''){
      sum += Number(v) * Number(c.peso);
      pesoUsado += Number(c.peso);
      any = true;
    }
  });
  let promedio = null;
  if(any && pesoUsado>0){ promedio = sum / pesoUsado; }
  if(g.recuperacion !== undefined && g.recuperacion !== null && g.recuperacion !== ''){
    const r = Number(g.recuperacion);
    promedio = (promedio===null) ? r : Math.max(promedio, r);
  }
  return promedio===null ? null : Math.round(promedio*10)/10;
}

function calcPromedioGeneral(alumnoId){
  const finals = [0,1,2].map(i=>calcMomentoFinal(alumnoId,i)).filter(v=>v!==null);
  if(!finals.length) return null;
  return Math.round((finals.reduce((a,b)=>a+b,0)/finals.length)*10)/10;
}

function nivelDe(promedio){
  if(promedio===null || promedio===undefined) return null;
  const niveles = state.config.niveles.slice().sort((a,b)=>a.min-b.min);
  let out = niveles[0];
  niveles.forEach(n=>{ if(promedio>=n.min) out=n; });
  return out;
}

/* ---------------- asistencia diaria: por defecto el alumno asistió; solo se marca cuando falta ---------------- */
function registrarDia(fecha){
  if(!state.asistencia.dias.includes(fecha)){
    state.asistencia.dias.push(fecha);
    state.asistencia.dias.sort();
    saveState();
  }
}
function quitarDia(fecha){
  state.asistencia.dias = state.asistencia.dias.filter(d=>d!==fecha);
  Object.keys(state.asistencia.faltas).forEach(alId=>{
    state.asistencia.faltas[alId] = (state.asistencia.faltas[alId]||[]).filter(d=>d!==fecha);
  });
  saveState();
}
function faltoEseDia(alumnoId, fecha){
  return (state.asistencia.faltas[alumnoId]||[]).includes(fecha);
}
function toggleFalta(alumnoId, fecha){
  if(!state.asistencia.faltas[alumnoId]) state.asistencia.faltas[alumnoId] = [];
  const arr = state.asistencia.faltas[alumnoId];
  const i = arr.indexOf(fecha);
  if(i>=0) arr.splice(i,1); else arr.push(fecha);
  saveState();
}
function diasEnMomento(idx){
  const m = state.config.momentos[idx];
  return state.asistencia.dias.filter(d=> d>=m.inicio && d<=m.fin);
}
function faltasEnMomento(alumnoId, idx){
  const dias = diasEnMomento(idx);
  const faltas = state.asistencia.faltas[alumnoId] || [];
  return dias.filter(d=>faltas.includes(d)).length;
}
function asistenciaPct(alumnoId, idx){
  const sesiones = diasEnMomento(idx).length;
  if(!sesiones) return null;
  const faltas = faltasEnMomento(alumnoId, idx);
  return Math.round((1 - (faltas/sesiones)) * 1000)/10;
}

function riesgoInfo(alumno){
  const reasons = [];
  const finals = [0,1,2].map(i=>calcMomentoFinal(alumno.id,i));
  const prom = calcPromedioGeneral(alumno.id);
  if(prom!==null && prom<6) reasons.push({t:'Promedio reprobatorio', level:'bad'});
  const filled = finals.map((v,i)=>({v,i})).filter(x=>x.v!==null);
  if(filled.length){
    const last = filled[filled.length-1];
    if(last.v<6) reasons.push({t:'Último momento reprobatorio', level:'bad'});
  }
  for(let i=0;i<2;i++){
    if(finals[i]!==null && finals[i+1]!==null && (finals[i+1]-finals[i])<=-1){
      reasons.push({t:`Bajó de M${i+1} a M${i+2}`, level:'warn'});
    }
  }
  for(let i=0;i<3;i++){
    const pct = asistenciaPct(alumno.id,i);
    if(pct!==null && pct < state.config.umbralAsistencia){
      reasons.push({t:`Asistencia baja M${i+1} (${pct}%)`, level:'warn'});
    }
  }
  const conductuales = observacionesFor(alumno.id).filter(o=>o.tipo==='Conductual');
  if(conductuales.length>=2) reasons.push({t:`${conductuales.length} notas conductuales`, level:'warn'});
  return { enRiesgo: reasons.length>0, reasons, promedio: prom, finals };
}

/* Alumnos que requieren apoyo específicamente en un momento (para la ficha grupal y reportes parciales) */
function momentoRiskList(idx){
  const momento = state.config.momentos[idx];
  return state.alumnos
    .filter(a=>a.status==='activo' && studentAppliesToMomento(a,momento))
    .map(a=>{
      const f = calcMomentoFinal(a.id, idx);
      const asis = asistenciaPct(a.id, idx);
      const motivos = [];
      if(f!==null && f<6) motivos.push(`calificación ${f}`);
      if(asis!==null && asis < state.config.umbralAsistencia) motivos.push(`asistencia ${asis}%`);
      return { a, f, asis, motivos };
    })
    .filter(x=>x.motivos.length>0);
}

/* Semáforo: resumen de un vistazo para reportes, sin tener que leer todas las tablas */
function semaforoDe(alumno){
  const r = riesgoInfo(alumno);
  const grave = r.reasons.some(x=>x.level==='bad');
  if(grave) return {icon:'🔴', label:'Requiere atención inmediata', color:'var(--brick)'};
  if(r.reasons.length>0) return {icon:'🟡', label:'Requiere seguimiento cercano', color:'var(--amber)'};
  return {icon:'🟢', label:'Va bien', color:'var(--good)'};
}

/* ---------------- Índice de Riesgo Escolar (IRE): 0-100, con explicación del cálculo ----------------
   Combina promedio, asistencia, tendencia, observaciones y uso de recuperación. Cada componente
   aporta un porcentaje del total; el desglose siempre se muestra para que el docente entienda el resultado. */
function calcularIRE(alumno){
  const detalle = [];

  const prom = calcPromedioGeneral(alumno.id);
  const compPromedio = prom!==null ? Math.max(0, Math.min(100, prom*10)) : 60;
  detalle.push({label:'Promedio general', valor: prom!==null?`${prom}/10`:'Sin datos', puntos: Math.round(compPromedio), peso:35});

  const asistencias = [0,1,2].map(i=>asistenciaPct(alumno.id,i)).filter(v=>v!==null);
  const compAsistencia = asistencias.length ? asistencias.reduce((a,b)=>a+b,0)/asistencias.length : 100;
  detalle.push({label:'Asistencia', valor: asistencias.length?`${Math.round(compAsistencia*10)/10}%`:'Sin registro', puntos: Math.round(compAsistencia), peso:20});

  const finals = [0,1,2].map(i=>calcMomentoFinal(alumno.id,i)).filter(v=>v!==null);
  let compTendencia = 65; // neutral cuando aún no hay suficientes momentos para comparar
  let tendenciaTxt = 'Sin suficientes momentos para comparar';
  if(finals.length>=2){
    const delta = finals[finals.length-1]-finals[finals.length-2];
    compTendencia = Math.max(0, Math.min(100, 60 + delta*20));
    tendenciaTxt = delta>0.3?`Mejorando (+${Math.round(delta*10)/10})`:delta<-0.3?`Bajando (${Math.round(delta*10)/10})`:'Estable';
  }
  detalle.push({label:'Tendencia entre momentos', valor:tendenciaTxt, puntos:Math.round(compTendencia), peso:15});

  const obs = observacionesFor(alumno.id);
  const positivas = obs.filter(o=>o.tipo==='Positiva').length;
  const preocupantes = obs.filter(o=>o.tipo==='Conductual' || o.tipo==='Atención a padres').length;
  const compObs = Math.max(0, Math.min(100, 75 + positivas*5 - preocupantes*8));
  detalle.push({label:'Observaciones registradas', valor:`${positivas} positiva(s), ${preocupantes} de atención`, puntos:Math.round(compObs), peso:20});

  let usoRecuperacion = false;
  [0,1,2].forEach(i=>{
    const g = (state.calificaciones[alumno.id]||{})[i];
    if(g && g.recuperacion!==undefined && g.recuperacion!=='') usoRecuperacion = true;
  });
  const compRecuperacion = usoRecuperacion ? 55 : 100;
  detalle.push({label:'Uso de recuperación', valor: usoRecuperacion?'Sí, en al menos un momento':'No ha necesitado', puntos:compRecuperacion, peso:10});

  const score = Math.round(detalle.reduce((acc,d)=> acc + d.puntos*(d.peso/100), 0));
  let nivel, color;
  if(score>=80){ nivel='Muy bajo riesgo'; color='var(--primary)'; }
  else if(score>=65){ nivel='Bajo riesgo'; color='var(--good)'; }
  else if(score>=50){ nivel='Riesgo medio'; color='var(--amber)'; }
  else if(score>=30){ nivel='Riesgo alto'; color='#C1703F'; }
  else { nivel='Riesgo crítico'; color='var(--brick)'; }

  return { score, nivel, color, detalle };
}

/* Resumen narrativo automático por alumno: reduce el trabajo de redactar el boletín a mano */
function resumenAutomaticoAlumno(alumnoId){
  const finals = [0,1,2].map(i=>calcMomentoFinal(alumnoId,i));
  const filled = finals.map((v,i)=>({v,i})).filter(x=>x.v!==null);
  const prom = calcPromedioGeneral(alumnoId);
  const niv = nivelDe(prom);
  if(!filled.length) return 'Aún no hay calificaciones registradas para generar un resumen.';
  let tendencia = '';
  if(filled.length>=2){
    const delta = Math.round((filled[filled.length-1].v - filled[filled.length-2].v)*10)/10;
    if(delta>=0.5) tendencia = `, con una mejora de ${delta} puntos respecto al momento anterior`;
    else if(delta<=-0.5) tendencia = `, con una baja de ${Math.abs(delta)} puntos respecto al momento anterior`;
    else tendencia = ', manteniendo un desempeño estable';
  }
  const obsCount = (state.observaciones[alumnoId]||[]).length;
  let texto = `Promedio general de ${prom??'—'}${niv?` (${niv.nombre})`:''}${tendencia}.`;
  if(obsCount>0) texto += ` Se han registrado ${obsCount} observación(es) en la bitácora durante el ciclo.`;
  return texto;
}

/* Sugerencias automáticas para la ficha descriptiva del grupo, a partir de los datos ya capturados */
function sugerirFortalezasGrupo(idx){
  const activos = activeStudents().filter(a=>studentAppliesToMomento(a, state.config.momentos[idx]));
  const finals = activos.map(a=>calcMomentoFinal(a.id,idx)).filter(v=>v!==null);
  if(!finals.length) return 'Aún no hay suficientes calificaciones capturadas en este momento para generar una sugerencia.';
  const prom = Math.round((finals.reduce((a,b)=>a+b,0)/finals.length)*10)/10;
  const aprob = Math.round((finals.filter(v=>v>=6).length/finals.length)*1000)/10;
  const destacados = activos.filter(a=>{ const f=calcMomentoFinal(a.id,idx); return f!==null && f>=9; }).length;
  let texto = `El grupo obtuvo un promedio de ${prom} en este momento, con ${aprob}% de aprobación.`;
  if(destacados>0) texto += ` ${destacados} alumno(s) alcanzaron un nivel de desempeño destacado.`;
  return texto;
}
function sugerirAreasGrupo(idx){
  const riesgo = momentoRiskList(idx);
  if(!riesgo.length) return 'No se detectaron alumnos en riesgo en este momento; se recomienda mantener el ritmo de trabajo actual.';
  const porCalif = riesgo.filter(x=>x.motivos.some(m=>m.startsWith('calificación'))).length;
  const porAsis = riesgo.filter(x=>x.motivos.some(m=>m.startsWith('asistencia'))).length;
  let texto = `${riesgo.length} alumno(s) requieren apoyo adicional en este momento`;
  const partes = [];
  if(porCalif>0) partes.push(`${porCalif} por calificación reprobatoria`);
  if(porAsis>0) partes.push(`${porAsis} por asistencia baja`);
  if(partes.length) texto += ` (${partes.join(', ')})`;
  texto += '. Se sugiere priorizar la atención de estos casos en las siguientes sesiones.';
  return texto;
}

function momentoStatus(m){

}

/* Aplica el filtro de fecha elegido (todas / últimos 7 o 30 días / rango personalizado),
   para que el reporte de canalización se centre en lo reciente y no se vuelva una hoja gigante. */
function observacionesFiltradasCanalizacion(alumnoId){
  const todas = observacionesRelevantesCanalizacion(alumnoId);
  if(canalizacionFiltro==='todas') return todas;
  if(canalizacionFiltro==='7' || canalizacionFiltro==='30'){
    const dias = Number(canalizacionFiltro);
    const limite = shiftDate(todayISO(), -dias);
    return todas.filter(o=> o.fecha>=limite);
  }
  if(canalizacionFiltro==='rango'){
    return todas.filter(o=> (!canalizacionDesde || o.fecha>=canalizacionDesde) && (!canalizacionHasta || o.fecha<=canalizacionHasta));
  }
  return todas;
}

/* ---------------- CSV helpers ---------------- */
function csvEscape(v){
  v = (v===null||v===undefined) ? '' : String(v);
  if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; }
      } else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>x!==''));
}

function buildCSVHeaders(){
  const headers = ['No','Nombre','Estatus','FechaAlta','FechaBaja','Motivo'];
  for(let i=0;i<3;i++){
    criteriosDe(i).forEach(c=> headers.push(`M${i+1}_${c.nombre}`));
    headers.push(`M${i+1}_Recuperacion`);
    headers.push(`M${i+1}_Sesiones`);
    headers.push(`M${i+1}_Faltas`);
    headers.push(`M${i+1}_Asistencia%`);
  }
  return headers;
}

function exportCSV(){
  const headers = buildCSVHeaders();
  const lines = [headers.join(',')];
  state.alumnos.slice().sort((a,b)=>Number(a.no)-Number(b.no)).forEach(a=>{
    const row = [a.no, a.nombre, a.status, a.fechaAlta||'', a.fechaBaja||'', a.motivo||''];
    for(let i=0;i<3;i++){
      const g = (state.calificaciones[a.id]||{})[i] || {};
      criteriosDe(i).forEach(c=> row.push(g[c.nombre]!==undefined ? g[c.nombre] : ''));
      row.push(g.recuperacion!==undefined ? g.recuperacion : '');
      row.push(diasEnMomento(i).length);
      row.push(faltasEnMomento(a.id, i));
      const asis = asistenciaPct(a.id, i);
      row.push(asis!==null ? asis : '');
    }
    lines.push(row.map(csvEscape).join(','));
  });
  return lines.join('\n');
}

/* CSV con el detalle de asistencia diaria: una fila por cada falta registrada (excepciones), más ligero que exportar día por día para todos */

/* CSV condensado a nivel grupo/momento: programación anual + ficha descriptiva, para el análisis general del docente */
function buildCondensadoCSV(){
  const cfg = state.config;
  const headers = ['Momento','Periodo','Contenido','PDA','SesionesPlaneadas','Inscritos','PromedioGrupal','PorcentajeAprobacion','DiasDeClaseRegistrados','AsistenciaGrupalPromedio','Fortalezas','AreasOportunidad','AlumnosApoyo','NotasApoyo'];
  const lines = [headers.join(',')];
  cfg.momentos.forEach((m,i)=>{

    const finals = list.filter(a=>a.status==='activo'||(a.fechaBaja&&a.fechaBaja>m.inicio)).map(a=>calcMomentoFinal(a.id,i)).filter(v=>v!==null);
    const prom = finals.length ? Math.round((finals.reduce((a,b)=>a+b,0)/finals.length)*10)/10 : '';
    const aprob = finals.length ? Math.round((finals.filter(v=>v>=6).length/finals.length)*1000)/10 : '';
    const diasRegistrados = diasEnMomento(i).length;
    const asistencias = list.filter(a=>a.status==='activo').map(a=>asistenciaPct(a.id,i)).filter(v=>v!==null);
    const asistGrupal = asistencias.length ? Math.round((asistencias.reduce((a,b)=>a+b,0)/asistencias.length)*10)/10 : '';
    const fg = state.fichaGrupal[i] || {fortalezas:'',areas:'',notasApoyo:''};
    const apoyo = momentoRiskList(i).map(x=>x.a.nombre).join('; ');
    const row = [m.nombre, mesesRango(m.inicio,m.fin), m.contenido||'', m.pda||'', m.sesiones??'', list.length, prom, aprob, diasRegistrados, asistGrupal, fg.fortalezas||'', fg.areas||'', apoyo, fg.notasApoyo||''];
    lines.push(row.map(csvEscape).join(','));
  });

/* CSV de bitácora: unifica observaciones y entregas de boletín por alumno, en orden cronológico */
function buildBitacoraCSV(){
  const cfg = state.config;
  const headers = ['No','Nombre','Fecha','Categoria','Momento','Detalle'];
  const rows = [];
  state.alumnos.slice().sort((a,b)=>Number(a.no)-Number(b.no)).forEach(a=>{
    (state.observaciones[a.id]||[]).forEach(o=>{
      const momentoNombre = (o.momento!==null && o.momento!==undefined && cfg.momentos[o.momento]) ? cfg.momentos[o.momento].nombre : 'General';
      rows.push([a.no, a.nombre, o.fecha, `Observación ${o.tipo}`, momentoNombre, o.texto]);
    });
    (state.entregas[a.id]||[]).forEach(e=>{
      rows.push([a.no, a.nombre, e.fecha, 'Entrega de boletín', '—', 'Boletín entregado a padre, madre o tutor']);
    });
  });
  rows.sort((r1,r2)=> Number(r1[0])-Number(r2[0]) || String(r1[2]).localeCompare(String(r2[2])));
  const lines = [headers.join(',')].concat(rows.map(r=>r.map(csvEscape).join(',')));
  return lines.join('\n');
}

function downloadText(filename, content, mime){
  const blob = new Blob([content], {type:mime||'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function importCSVText(text){
  const rows = parseCSV(text);
  if(!rows.length) return {ok:false, msg:'El archivo está vacío o no se pudo leer.'};
  const headers = rows[0].map(h=>h.trim());
  const idx = {};
  headers.forEach((h,i)=> idx[h]=i);
  if(!('No' in idx) || !('Nombre' in idx)){
    return {ok:false, msg:'El CSV debe tener al menos las columnas "No" y "Nombre".'};
  }
  let nuevos=0, actualizados=0;
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    const no = row[idx['No']];
    const nombre = (row[idx['Nombre']]||'').trim();
    if(!nombre) continue;
    let alumno = state.alumnos.find(a=>String(a.no)===String(no));
    if(!alumno){
      alumno = { id:uid(), no: no || (state.alumnos.length+1), nombre, status:'activo', fechaAlta: todayISO(), fechaBaja:null, motivo:'' };
      state.alumnos.push(alumno);
      nuevos++;
    } else { actualizados++; }
    alumno.nombre = nombre;
    if('Estatus' in idx && row[idx['Estatus']]) alumno.status = row[idx['Estatus']].toLowerCase().includes('baja') ? 'baja' : 'activo';
    if('FechaAlta' in idx && row[idx['FechaAlta']]) alumno.fechaAlta = row[idx['FechaAlta']];
    if('FechaBaja' in idx && row[idx['FechaBaja']]) alumno.fechaBaja = row[idx['FechaBaja']];
    if('Motivo' in idx && row[idx['Motivo']]) alumno.motivo = row[idx['Motivo']];

    if(!state.calificaciones[alumno.id]) state.calificaciones[alumno.id] = {};
    for(let i=0;i<3;i++){
      const gObj = state.calificaciones[alumno.id][i] || {};
      criteriosDe(i).forEach(c=>{
        const key = `M${i+1}_${c.nombre}`;
        if(key in idx && row[idx[key]]!==''&&row[idx[key]]!==undefined) gObj[c.nombre] = row[idx[key]];
      });
      const recKey = `M${i+1}_Recuperacion`;
      if(recKey in idx && row[idx[recKey]]!=='') gObj.recuperacion = row[idx[recKey]];
      state.calificaciones[alumno.id][i] = gObj;
    }
  }
  saveState();
  return {ok:true, msg:`Listo. ${nuevos} alumno(s) nuevo(s), ${actualizados} actualizado(s).`};
}

/* ---------------- abreviaturas y leyenda de aspectos evaluados ---------------- */
const CRIT_COLORS = ['#2F6F63','#B9791F','#6E5B9E','#3E8C63','#B8503F','#1D5C8A','#8A6D3B','#4A7A9D'];
function stripAccents(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function textColorFor(hex){
  const c = String(hex||'').replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255; // percepción de brillo
  return lum > 0.55 ? '#1E2A26' : '#FFFFFF';
}
function criteriaAbbrev(idx){
  const used = {};
  return criteriosDe(idx).map((c,i)=>{
    let base = stripAccents(c.nombre).toUpperCase().replace(/[^A-Z]/g,'').slice(0,3) || ('C'+(i+1));
    let abbr = base;
    let n = 1;
    while(used[abbr]){ n++; abbr = base.slice(0, Math.max(2,3-String(n).length)) + n; }
    used[abbr] = true;
    const color = CRIT_COLORS[i % CRIT_COLORS.length];
    return { nombre:c.nombre, peso:c.peso, abbr, color, textColor: textColorFor(color) };
  });
}
function chunkArr(arr, size){ const out=[]; for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out; }
function criteriaLegendHTML(idx){
  const items = criteriaAbbrev(idx);
  const groups = chunkArr(items, 3);
  const rows = groups.map(g=>{
    const cells = g.map(it=>`<td style="padding:3px 6px 3px 0; white-space:nowrap; vertical-align:middle;"><span class="crit-badge" style="background:${it.color}; color:${it.textColor};">${it.abbr}</span></td><td style="padding:3px 22px 3px 6px; white-space:nowrap; vertical-align:middle;">${esc(it.nombre)} (${it.peso}%)</td>`).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
  return `<div class="crit-legend">
    <b>Referencia de aspectos evaluados</b>
    <table><tbody>${rows}</tbody></table>
  </div>`;
}
function criteriaHeaderCells(idx){
  return criteriaAbbrev(idx).map(it=>`<th title="${esc(it.nombre)}"><span class="crit-badge" style="background:${it.color}; color:${it.textColor}; margin-right:0;">${it.abbr}</span></th>`).join('');
}

/* Recordatorios pedagógicos: avisos calculados a partir de los datos, para que el docente no tenga que revisar todo manualmente */
function computeRecordatorios(){
  const avisos = [];
  const cfg = state.config;
  const activos = activeStudents();
  const activeMIdx = cfg.momentos.findIndex(m=>momentoStatus(m)==='en-curso');
  if(activeMIdx>=0){
    const m = cfg.momentos[activeMIdx];
    const diasRestantes = Math.ceil((new Date(m.fin) - new Date(todayISO())) / 86400000);
    const sinCalificar = activos.filter(a=>studentAppliesToMomento(a,m) && calcMomentoFinal(a.id, activeMIdx)===null).length;
    if(diasRestantes>=0 && diasRestantes<=7 && sinCalificar>0){
      avisos.push({icon:'⏰', texto:`${m.nombre} cierra en ${diasRestantes} día(s) y tienes ${sinCalificar} alumno(s) sin calificación registrada.`, tab:'calificaciones'});
    }
    const fg = state.fichaGrupal[activeMIdx];
    if(!fg || (!fg.fortalezas && !fg.areas)){
      avisos.push({icon:'📝', texto:`Aún no capturas la ficha descriptiva del grupo para ${m.nombre}.`, tab:'grupal'});
    }
  }
  if(activeMIdx>=0 && !state.asistencia.dias.includes(todayISO())){
    avisos.push({icon:'🗓️', texto:'Aún no has tomado asistencia hoy.', tab:'asistencia'});
  }
  const riesgoSinObs = activos.filter(a=> riesgoInfo(a).enRiesgo && observacionesFor(a.id).length===0);
  if(riesgoSinObs.length>0){
    avisos.push({icon:'⚠️', texto:`${riesgoSinObs.length} alumno(s) en riesgo no tienen ninguna observación registrada en la bitácora.`, tab:'riesgo'});
  }
  const candidatosCanal = activos.filter(a=>esCandidatoCanalizacion(a.id));
  if(candidatosCanal.length>0){
    avisos.push({icon:'🚩', texto:`${candidatosCanal.length} alumno(s) acumulan suficientes observaciones para canalizar a Trabajo Social/Orientación.`, tab:'reportes'});
  }
  const pesoTot = pesoTotal();
  if(pesoTot!==100){
    avisos.push({icon:'⚖️', texto:`Tus criterios de evaluación suman ${pesoTot}% en vez de 100%.`, tab:'datos'});
  }
  return avisos;
}

function fmtDate(d){
  if(!d) return '—';
  const [y,m,day] = d.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${day} ${meses[Number(m)-1]} ${y}`;
}

const MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function capitalizar(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function mesesRango(inicioStr, finStr){
  if(!inicioStr || !finStr) return '—';
  const [y1,m1] = inicioStr.split('-').map(Number);
  const [y2,m2] = finStr.split('-').map(Number);
  if(y1===y2){
    if(m1===m2) return `${capitalizar(MESES_LARGOS[m1-1])} ${y1}`;
    return `${capitalizar(MESES_LARGOS[m1-1])} – ${capitalizar(MESES_LARGOS[m2-1])} ${y1}`;
  }
  return `${capitalizar(MESES_LARGOS[m1-1])} ${y1} – ${capitalizar(MESES_LARGOS[m2-1])} ${y2}`;
}

function polaridadClase(p){

}
function phraseChipsHTML(tipo, targetId){
  const items = PHRASE_BANK[tipo] || [];
  if(!items.length) return '';
  const grupos = [];
  items.forEach(it=>{
    let g = grupos.find(x=>x.nombre===it.g);
    if(!g){ g = {nombre:it.g, frases:[]}; grupos.push(g); }
    g.frases.push(it);
  });
  return `<div style="margin:8px 0 4px;">
    <p style="font-size:11px; color:var(--ink-faint); margin-bottom:6px;">Toca una frase para insertarla — <span style="color:var(--good); font-weight:700;">🟢 positivo</span> · <span style="color:var(--amber); font-weight:700;">🟡 informativo</span> · <span style="color:var(--brick); font-weight:700;">🔴 área de oportunidad</span></p>

      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        ${g.frases.map(it=>`<button type="button" class="chip ${polaridadClase(it.p)}" style="cursor:pointer; border:1px solid transparent; padding:6px 12px;" data-phrase="${esc(it.t)}">${it.t.length>46?it.t.slice(0,46)+'…':it.t}</button>`).join('')}
      </div>`).join('')}
  </div>`;
}
function bindPhraseChips(container, targetId){
  container.querySelectorAll('[data-phrase]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const ta = document.getElementById(targetId);

      ta.value = ta.value.trim() ? (ta.value.trim().replace(/\.?$/,'.') + ' ' + phrase) : phrase;

}

  el.innerHTML = `

    if(filter) list = list.filter(a=> a.nombre.toLowerCase().includes(filter) || String(a.no).includes(filter));
    if(!list.length){ tb.innerHTML = `<tr><td colspan="7"><div class="empty"><svg><use href="#ic-users"/></svg><div>No hay alumnos que coincidan.</div></div></td></tr>`; return; }
    tb.innerHTML = list.map(a=>{
      const nObs = observacionesFor(a.id).length;
      return `<tr>
        <td>${a.no}</td><td>${a.nombre}</td>
        <td>${a.status==='activo'?'<span class="chip chip-good">Activo</span>':'<span class="chip chip-bad">Baja</span>'}</td>
        <td>${fmtDate(a.fechaAlta)}</td><td>${a.fechaBaja?fmtDate(a.fechaBaja):'—'}</td>
        <td>${nObs>0?`<span class="chip chip-violet">${nObs}</span>`:'—'}</td>
        <td style="text-align:right; white-space:nowrap;">
          <button class="btn btn-sm btn-ghost" data-ficha="${a.id}" title="Ver ficha"><svg style="width:14px;height:14px"><use href="#ic-eye"/></svg></button>
          <button class="btn btn-sm btn-ghost" data-edit="${a.id}" title="Editar"><svg style="width:14px;height:14px"><use href="#ic-edit"/></svg></button>
          <button class="btn btn-sm ${a.status==='activo'?'':'btn-primary'}" data-toggle="${a.id}">${a.status==='activo'?'Dar de baja':'Reactivar'}</button>
        </td>
      </tr>`;
    }).join('');
    tb.querySelectorAll('[data-ficha]').forEach(b=>b.addEventListener('click',()=>openFichaModal(b.dataset.ficha)));
    tb.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openAlumnoModal(b.dataset.edit)));
    tb.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>toggleBaja(b.dataset.toggle)));
  }
  draw('');
  document.getElementById('searchAl').addEventListener('input', e=>{ draw(e.target.value.toLowerCase()); });
  document.getElementById('addAlumno').addEventListener('click', ()=>openAlumnoModal(null));
  document.getElementById('pasteAlumnos').addEventListener('click', openPasteAlumnosModal);
}

/* ---- Pegar lista de alumnos desde Excel (altas masivas) ---- */
function openPasteAlumnosModal(){
  openModal(`
    <button class="modal-close" data-close>×</button>
    <h3 style="font-size:17px;margin-bottom:8px;">Pegar lista de alumnos desde Excel</h3>
    <p class="hint">Copia en Excel una o dos columnas (No. de lista y Nombre, o solo Nombre) y pégalas aquí abajo. Cada línea se agregará como un alumno nuevo, con fecha de alta de hoy.</p>
    <div class="field"><textarea id="pa-text" rows="8" placeholder="1&#9;ARJONA LOPEZ VALERIA&#10;2&#9;BLANCO ALVAREZ LUIS ANGEL&#10;...o solo el nombre, uno por línea"></textarea></div>
    <div class="field"><label>Fecha de alta para todos</label><input type="date" id="pa-fecha" value="${todayISO()}"></div>
    <div id="pa-preview" class="hint" style="margin-bottom:10px;"></div>
    <div class="btnrow" style="justify-content:flex-end;">
      <button class="btn" data-close>Cancelar</button>
      <button class="btn btn-primary" id="pa-confirm">Agregar alumnos</button>
    </div>
  `, true);
  const ta = document.getElementById('pa-text');
  const preview = document.getElementById('pa-preview');
  function parsePasted(){
    const lines = ta.value.replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(l=>l.length);
    const rows = lines.map(l=> l.split('\t').map(x=>x.trim()));
    return rows;
  }
  ta.addEventListener('input', ()=>{
    const rows = parsePasted();
    preview.textContent = rows.length ? `Se detectaron ${rows.length} alumno(s) listos para agregar.` : '';
  });
  document.getElementById('pa-confirm').addEventListener('click', ()=>{
    const rows = parsePasted();
    if(!rows.length){ toast('Pega al menos un renglón con un nombre'); return; }
    const fecha = document.getElementById('pa-fecha').value || todayISO();
    let nextNo = Math.max(0, ...state.alumnos.map(x=>Number(x.no)||0)) + 1;
    let agregados = 0;
    rows.forEach(cols=>{
      let no, nombre;
      if(cols.length>=2 && /^\d+$/.test(cols[0])){ no = Number(cols[0]); nombre = cols[1]; }
      else { no = nextNo; nombre = cols[0]; }
      nombre = (nombre||'').trim();
      if(!nombre) return;
      state.alumnos.push({ id:uid(), no, nombre, status:'activo', fechaAlta:fecha, fechaBaja:null, motivo:'' });
      nextNo = Math.max(nextNo, no+1);
      agregados++;
    });
    saveState(); closeModal(); toast(`${agregados} alumno(s) agregado(s)`); renderAll();
  });
}

function toggleBaja(id){
  const a = state.alumnos.find(x=>x.id===id);
  if(a.status==='activo'){ openBajaModal(id); }
  else { a.status='activo'; a.fechaBaja=null; a.motivo=''; saveState(); toast('Alumno reactivado'); renderAll(); }
}

  document.getElementById('al-confirm').addEventListener('click', ()=>{
    const nombre = document.getElementById('al-nombre').value.trim();
    if(!nombre){ toast('Escribe el nombre del alumno'); return; }
    if(editing){
      a.no = document.getElementById('al-no').value;
      a.fechaAlta = document.getElementById('al-fecha').value;
      a.nombre = nombre;
    } else {
      state.alumnos.push({ id:uid(), no: document.getElementById('al-no').value, nombre, status:'activo',
        fechaAlta: document.getElementById('al-fecha').value, fechaBaja:null, motivo:'' });
    }
    saveState(); closeModal(); toast(editing?'Alumno actualizado':'Alumno agregado'); renderAll();
  });
}

/* ---- Ficha del alumno (perfil individual + observaciones) ---- */
function buildFichaBodyHTML(alumnoId, opciones){
  opciones = opciones || {scope:'general'};
  const a = state.alumnos.find(x=>x.id===alumnoId);
  if(!a) return '<p>Alumno no encontrado.</p>';
  const cfg = state.config;
  const prom = calcPromedioGeneral(a.id);
  const niv = nivelDe(prom);
  const r = riesgoInfo(a);
  const ire = calcularIRE(a);

  // Alcance del reporte: evita entregar todo el historial cuando solo se necesita un corte preciso.
  let momentosMostrar = cfg.momentos.map((m,i)=>i);
  let obs = observacionesFor(a.id);
  let alcanceTxt = 'Historial completo';
  if(opciones.scope==='momento' && opciones.momentoIdx!==undefined && opciones.momentoIdx!==null){
    const idx = opciones.momentoIdx;
    const m = cfg.momentos[idx];
    momentosMostrar = [idx];
    obs = obs.filter(o=> o.momento===idx || (o.fecha>=m.inicio && o.fecha<=m.fin));
    alcanceTxt = `Solo ${m.nombre}`;
  } else if(opciones.scope==='fecha'){
    obs = obs.filter(o=> (!opciones.desde || o.fecha>=opciones.desde) && (!opciones.hasta || o.fecha<=opciones.hasta));
    alcanceTxt = `Del ${opciones.desde?fmtDate(opciones.desde):'inicio del ciclo'} al ${opciones.hasta?fmtDate(opciones.hasta):'hoy'}`;
  }

  return `
    ${reportHeaderHTML('Ficha individual del alumno', 'FIC')}
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
      <div><h3 style="margin-bottom:2px;">${a.no}. ${esc(a.nombre)}</h3>
        <span style="font-size:12.5px; color:var(--ink-faint)">${a.status==='activo'?'Activo':'Baja'} · Alta: ${fmtDate(a.fechaAlta)}${a.fechaBaja?(' · Baja: '+fmtDate(a.fechaBaja)):''}</span></div>
      <div style="text-align:right;">
        <div style="font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:${prom!==null&&prom<6?'var(--brick)':'var(--primary)'}">${prom??'—'}</div>
        <div style="font-size:11px; color:var(--ink-faint)">Promedio general ${niv?('· '+niv.nombre):''}</div>
      </div>
    </div>
    <p style="font-size:11px; color:var(--ink-faint); margin-bottom:12px;">Alcance de este reporte: <b>${alcanceTxt}</b></p>
    ${r.enRiesgo?`<div style="margin-bottom:12px;">${r.reasons.map(x=>`<span class="chip ${x.level==='bad'?'chip-bad':'chip-warn'}" style="margin-right:6px;">${x.t}</span>`).join('')}</div>`:''}
    <h3>Índice de Riesgo Escolar (IRE)</h3>
    <div style="border:1px solid #DCE6E0; border-radius:8px; padding:10px 14px; margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-weight:800; color:${ire.color};">${ire.nivel}</span>
        <span style="font-size:18px; font-weight:700; color:${ire.color};">${ire.score}/100</span>
      </div>
      ${ire.detalle.map(d=>`<div style="display:flex; justify-content:space-between; font-size:11px; color:#5C6D66;"><span>${d.label} (${d.peso}%)</span><span>${esc(String(d.valor))}</span></div>`).join('')}
    </div>
    <h3>Calificaciones ${momentosMostrar.length<cfg.momentos.length? `— ${cfg.momentos[momentosMostrar[0]].nombre}` : 'por momento'}</h3>
    ${momentosMostrar.map(i=>{
      const m = cfg.momentos[i];
      const g = (state.calificaciones[a.id]||{})[i] || {};
      const f = calcMomentoFinal(a.id,i);
      const n = nivelDe(f);
      const asis = asistenciaPct(a.id,i);
      return `<p style="font-size:11.5px; font-weight:700; color:var(--ink-soft); margin:10px 0 4px;">${m.nombre}</p>
      <div class="table-wrap" style="margin-bottom:10px;"><table><thead><tr>${criteriaHeaderCells(i)}<th>Recup.</th><th>Final</th><th>Nivel</th><th>Asistencia</th></tr></thead>
      <tbody><tr>${criteriosDe(i).map(c=>`<td>${g[c.nombre]!==undefined&&g[c.nombre]!==''?g[c.nombre]:'—'}</td>`).join('')}<td>${g.recuperacion||'—'}</td><td><b>${f??'—'}</b></td><td>${n?n.nombre:'—'}</td><td>${asis!==null?asis+'%':'—'}</td></tr></tbody></table></div>
      ${criteriaLegendHTML(i)}`;
    }).join('')}
    <h3>Observaciones registradas <span style="font-size:11px; font-weight:400; color:var(--ink-faint);">(${alcanceTxt})</span></h3>
    ${obs.length? obs.map(o=>`<div style="border:1px solid #DCE6E0;border-radius:8px;padding:8px 10px;margin-bottom:6px;">
      <div style="font-size:11px;color:#8A9994;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;"><span>${fmtDate(o.fecha)}${o.momento!==null&&o.momento!==undefined?(' · '+cfg.momentos[o.momento].nombre):''}</span><span class="chip" style="white-space:normal;">${o.tipo}</span></div>
      <div style="font-size:12.5px;margin-top:3px;">${esc(o.texto)}</div>
    </div>`).join('') : '<p style="font-size:12.5px;color:#8A9994;">Sin observaciones registradas en este alcance.</p>'}
    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-top:50px; text-align:center; font-size:12px;">
      <div>________________________<br>Padre, madre o tutor</div>
      <div>________________________<br>Profesor(a)</div>
    </div>
  `;
}

function buildTraspasoHTML(){
  const cfg = state.config;
  const activos = activeStudents();
  const casos = activos
    .map(a=>({a, ire:calcularIRE(a), prom:calcPromedioGeneral(a.id)}))
    .filter(x=>x.ire.score<50)
    .sort((x,y)=>x.ire.score-y.ire.score);

  if(!casos.length){
    return `${reportHeaderHTML('Traspaso de continuidad para el siguiente ciclo escolar', 'TRA')}
      <p style="font-size:13px; color:var(--ink-soft);">No se detectaron alumnos activos con riesgo alto o crítico (IRE menor a 50) al momento de generar este documento. 🎉</p>`;
  }

  const bloques = casos.map(({a, ire, prom})=>{
    const obs = observacionesFor(a.id).slice(0,6);
    const asisTxt = cfg.momentos.map((m,i)=>{
      const p = asistenciaPct(a.id,i);
      return p!==null ? `${m.nombre}: ${p}%` : null;
    }).filter(Boolean).join(' · ');
    return `
    <div style="border:1px solid #DCE6E0; border-radius:10px; padding:12px 14px; margin-bottom:14px; page-break-inside:avoid;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:6px;">
        <b style="font-size:14px;">${a.no}. ${esc(a.nombre)}</b>
        <span style="font-weight:800; color:${ire.color};">IRE ${ire.score}/100 · ${ire.nivel}</span>
      </div>
      <p style="font-size:12px; color:#5C6D66; margin-bottom:6px;"><b>Promedio general:</b> ${prom??'—'} &nbsp;·&nbsp; <b>Asistencia:</b> ${asisTxt||'Sin registro'}</p>
      <p style="font-size:12px; margin-bottom:8px;">${esc(resumenAutomaticoAlumno(a.id))}</p>
      ${obs.length? `<div style="font-size:11px; color:#5C6D66; margin-bottom:4px;"><b>Últimas observaciones:</b></div>
        ${obs.map(o=>`<div style="font-size:11px; margin-bottom:2px;">• ${fmtDate(o.fecha)} (${o.tipo}): ${esc(o.texto)}</div>`).join('')}` : '<p style="font-size:11px; color:#8A9994;">Sin observaciones registradas.</p>'}
    </div>`;
  }).join('');

  return `
    ${reportHeaderHTML('Traspaso de continuidad para el siguiente ciclo escolar', 'TRA')}
    <p style="font-size:12.5px; color:#5C6D66; margin-bottom:16px;">Este documento resume a los alumnos que, al cierre de este ciclo, continúan requiriendo seguimiento cercano (bajo rendimiento y/o faltas críticas), para que el profesor que reciba al grupo dé continuidad sin partir de cero. Se incluyen ${casos.length} alumno(s), ordenados del caso más urgente al menos urgente.</p>
    ${bloques}
    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-top:30px; text-align:center; font-size:12px;">
      <div>________________________<br>Profesor(a) que entrega</div>
      <div>________________________<br>Profesor(a) que recibe</div>
    </div>`;
}

function buildBoletinPadresHTML(alumnoId){
  const a = state.alumnos.find(x=>x.id===alumnoId);
  if(!a) return '<p>Alumno no encontrado.</p>';
  const cfg = state.config;
  const prom = calcPromedioGeneral(a.id);
  const niv = nivelDe(prom);
  const semaforo = semaforoDe(a);
  const entregas = entregasFor(a.id);
  const obsAll = (state.observaciones[a.id]||[]).slice().sort((x,y)=> x.fecha.localeCompare(y.fecha));
  const gruposObs = cfg.momentos.map((m,i)=> obsAll.filter(o=>o.momento===i));
  const generales = obsAll.filter(o=> o.momento===null || o.momento===undefined);

  const bloqueObs = (titulo, list)=> `<div style="margin-bottom:12px;">
    <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:#5C6D66; margin-bottom:5px;">${titulo}</div>
    ${list.length? list.map(o=>`<div style="border-left:3px solid #DCE6E0; padding:4px 0 4px 10px; margin-bottom:5px;">
        <div style="font-size:10.5px; color:#8A9994;">${fmtDate(o.fecha)} · <span class="chip ${tipoColor(o.tipo)}" style="color:#1E2A26;">${o.tipo}</span></div>
        <div style="font-size:12px; margin-top:1px;">${esc(o.texto)}</div>
      </div>`).join('') : '<div style="font-size:11.5px; color:#8A9994;">Sin observaciones registradas en este periodo.</div>'}

  return `
    ${reportHeaderHTML('Boletín informativo para padres de familia', 'BOL')}

      <h3 style="font-size:17px; margin-bottom:2px;">${esc(a.nombre)}</h3>
      <span style="font-size:12px; color:#8A9994;">No. de lista ${a.no}${a.status!=='activo'?(' · Baja registrada el '+fmtDate(a.fechaBaja)):''}</span>
    </div>

    <div style="text-align:center; border:1px solid #DCE6E0; border-radius:10px; padding:12px; margin-bottom:16px; background:#F5F8F6;">
      <div style="font-size:15px; font-weight:800; color:${semaforo.color};">${semaforo.icon} ${semaforo.label}</div>
      <p style="font-size:12.5px; margin-top:6px; color:#333;">${esc(resumenAutomaticoAlumno(a.id))}</p>
    </div>

    <h3>¿Cómo va académicamente?</h3>
    <div class="table-wrap"><table><thead><tr><th>Momento</th><th>Periodo</th><th>Calificación</th><th>Nivel</th><th>Asistencia</th></tr></thead>
      <tbody>${cfg.momentos.map((m,i)=>{
        const f = calcMomentoFinal(a.id,i); const n = nivelDe(f);
        const asis = asistenciaPct(a.id,i);
        const bajaAsis = asis!==null && asis<cfg.umbralAsistencia;
        return `<tr><td>${m.nombre}</td><td>${mesesRango(m.inicio,m.fin)}</td><td><b>${f??'—'}</b></td><td>${n?`<span class="chip" style="background:${n.color}22;color:${n.color}">${n.nombre}</span>`:'—'}</td><td style="color:${bajaAsis?'var(--brick)':'inherit'}; font-weight:${bajaAsis?'800':'400'};">${asis!==null?asis+'%':'—'}</td></tr>`;

    </table></div>
    <p style="font-size:13px; margin:8px 0 12px;"><b>Promedio general del ciclo:</b> ${prom??'—'} ${niv?('· '+niv.nombre):''}</p>
    ${cfg.momentos.some((m,i)=>{ const asis=asistenciaPct(a.id,i); return asis!==null && asis<cfg.umbralAsistencia; }) ? `

    ${cfg.momentos.map((m,i)=> bloqueObs(`${m.nombre} · ${mesesRango(m.inicio,m.fin)}`, gruposObs[i])).join('')}
    ${generales.length? bloqueObs('Observaciones generales', generales) : ''}

    ${entregas.length? `<h3>Historial de entrega de este boletín</h3>
    <p style="font-size:12px;">${entregas.map(e=>fmtDate(e.fecha)).join('  ·  ')}</p>` : ''}

    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-top:46px; text-align:center; font-size:12px;">
